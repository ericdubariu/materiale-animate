<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1320">
<title>Triviador · Corpul uman</title>
<style>
/*__FONTS__*/
:root{
  --ink:#1A1320; --ink2:#140D1C;
  --panel:rgba(43,32,52,.44); --panel2:rgba(35,26,43,.66); --well:rgba(16,9,22,.38); --hover:rgba(226,205,238,.05);
  --line:rgba(226,205,238,.10); --line2:rgba(226,205,238,.17); --line3:rgba(226,205,238,.30);
  --teal:#F09AC6; --teal-d:#C2558C; --amber:#FFBE5C; --amber-d:#C98A2E;
  --bone:#F3ECF6; --dim:#B8ABC4; --faint:#9C8FAA;
  --ok:#5ee8a0; --bad:#FF6B6B; --warn:#ffd166;
  --p1:var(--teal); --p2:var(--amber);
  --r-card:18px; --r-tile:14px; --r-ctl:10px; --r-sm:7px; --r-pill:999px;
  --h-ctl:40px; --h-chip:36px;
  --ease:cubic-bezier(.2,.7,.2,1); --out:cubic-bezier(.16,1,.3,1);
  --disp:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --text:"Inter", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (pointer:coarse){:root{--h-ctl:44px;--h-chip:44px}}
*{box-sizing:border-box}
html{color-scheme:dark}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--bone);font:400 15px/1.55 var(--text);-webkit-font-smoothing:antialiased;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:
   radial-gradient(1100px 700px at 28% 14%, rgba(240,154,198,.085), transparent 60%),
   radial-gradient(900px 700px at 88% 92%, rgba(255,190,92,.05), transparent 60%),
   radial-gradient(700px 520px at 50% 50%, rgba(120,60,130,.20), transparent 70%),
   var(--ink)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.32;
  background-image:linear-gradient(rgba(226,205,238,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(226,205,238,.05) 1px,transparent 1px);
  background-size:40px 40px;mask-image:radial-gradient(circle at 50% 35%,#000 25%,transparent 80%);-webkit-mask-image:radial-gradient(circle at 50% 35%,#000 25%,transparent 80%)}
#amb{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--disp);font-weight:700;letter-spacing:-.015em;margin:0}
b,strong{font-weight:600}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}

/* ---------- mișcare ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:0;transform:translateY(10px) scale(.965)}to{opacity:1;transform:none}}
@keyframes sheetOut{to{opacity:0;transform:translateY(6px) scale(.98)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes press{0%{transform:scale(1)}35%{transform:scale(.985)}100%{transform:scale(1)}}
@keyframes resIn{from{opacity:.35;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes verdictIn{from{opacity:0;transform:translateY(6px);clip-path:inset(0 70% 0 0 round 12px)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0 round 12px)}}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,14px) scale(.96)}12%{opacity:1;transform:translate(-50%,0) scale(1)}82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(240,154,198,.45)}50%{box-shadow:0 0 0 6px rgba(240,154,198,0)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}100%{opacity:0;transform:translate(-50%,-46px)}}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.enter{animation:screenIn .42s var(--out) both}
.shake{animation:shake .45s var(--ease)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001ms!important;transition-delay:0s!important}}
body.reduced *,body.reduced *::before,body.reduced *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001ms!important;transition-delay:0s!important}

/* ---------- bara de sus ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;height:58px;padding:0 18px;
  background:rgba(26,19,32,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--disp);font-weight:700;font-size:16px;white-space:nowrap;letter-spacing:-.01em}
.brand span{color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px;border-left:1px solid var(--line2)}
.ib{display:inline-flex;align-items:center;gap:7px;height:var(--h-ctl);padding:0 12px;border-radius:var(--r-ctl);border:1px solid transparent;
  color:var(--dim);font-size:13.5px;font-weight:500;transition:background .2s,color .2s,border-color .2s}
.ib:hover,.ib[aria-expanded=true]{background:var(--hover);color:var(--bone);border-color:var(--line)}
.ib svg{width:17px;height:17px}
.ib.off svg{opacity:.45}
.ib .eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px;margin-left:2px}
.ib .eq i{width:2px;border-radius:1px;background:var(--teal);height:4px;animation:eq 1.1s ease-in-out infinite}
.ib .eq i:nth-child(2){animation-delay:-.4s}.ib .eq i:nth-child(3){animation-delay:-.75s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.ib.off .eq{display:none}
@media (max-width:640px){.ib .lb{display:none}.ib{padding:0 11px}.brand span{display:none}.top{padding:0 8px 0 12px}}

/* ---------- panoul de sunet ---------- */
.sndpop{position:fixed;z-index:85;width:318px;padding:16px 16px 12px;border-radius:var(--r-tile);border:1px solid var(--line2);
  background:linear-gradient(170deg,rgba(52,37,62,.97),rgba(35,26,43,.98));box-shadow:0 24px 60px -24px rgba(0,0,0,.8);animation:sheetIn .24s var(--out) both}
.sndpop .sp-h{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.sndpop .sp-h b{font-family:var(--disp);font-weight:700;font-size:15px}
.sndpop .sp-h span{color:var(--faint);font-size:12px}
.srow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.mute{flex:none;width:var(--h-ctl);height:var(--h-ctl);border-radius:var(--r-ctl);border:1px solid var(--line2);display:grid;place-items:center;color:var(--teal);transition:background .2s,color .2s}
.mute svg{width:18px;height:18px}
.mute[aria-pressed=false]{color:var(--faint);background:rgba(255,107,107,.06)}
.mute:hover{background:var(--hover)}
.sl{flex:1;min-width:0}
.slh{display:flex;justify-content:space-between;font-size:13px;font-weight:500}
.slh output{font-family:var(--mono);font-size:12px;color:var(--dim)}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:26px;margin:0;background:transparent;--v:50%;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:99px;background:linear-gradient(90deg,var(--teal) var(--v),rgba(226,205,238,.15) var(--v))}
input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:rgba(226,205,238,.15)}
input[type=range]::-moz-range-progress{height:4px;border-radius:99px;background:var(--teal)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:var(--bone);box-shadow:0 0 0 4px rgba(240,154,198,.16);transition:box-shadow .2s}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--bone);box-shadow:0 0 0 4px rgba(240,154,198,.16)}
input[type=range]:active::-webkit-slider-thumb{box-shadow:0 0 0 7px rgba(240,154,198,.22)}
input[type=range].muted{--teal:#5E4F6B}
@media (pointer:coarse){input[type=range]{height:44px}input[type=range]::-webkit-slider-thumb{width:22px;height:22px;margin-top:-9px}input[type=range]::-moz-range-thumb{width:22px;height:22px}}
.sndpop .note{margin:6px 0 0;color:var(--faint);font-size:11.5px}

/* ---------- ecrane și ecranul de pornire ---------- */
.screen{max-width:1160px;margin:0 auto;padding:26px 20px calc(116px + var(--safe-b))}
.screen.narrow{max-width:920px}
.panel{background:linear-gradient(180deg,rgba(48,35,58,.46),rgba(35,26,43,.40));border:1px solid var(--line);border-radius:var(--r-card)}
@media (max-width:640px){.screen{padding:16px 12px calc(120px + var(--safe-b))}}

.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:28px;align-items:center;margin:8px 0 26px}
.hero .eyebrow .pulse{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulseDot 2.4s ease-in-out infinite}
.hero h1{font-size:clamp(30px,4.6vw,50px);line-height:1.04;margin-top:14px}
.hero h1 span{display:block;color:transparent;background:linear-gradient(90deg,#F9D3E7,#F09AC6 60%,#B98BD0);-webkit-background-clip:text;background-clip:text}
.hero p{color:var(--dim);max-width:52ch;margin:14px 0 0;font-size:15px}
.hero .bodymini{height:310px;display:flex;justify-content:center;opacity:.95}
.hero .bodymini svg{height:100%;width:auto}
@media (max-width:760px){.hero{grid-template-columns:1fr;margin-bottom:18px}.hero .bodymini{display:none}}

.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;max-width:560px}
.pin{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:9px 14px;border-radius:12px;
  border:1px solid var(--line2);background:var(--well);cursor:text;transition:border-color .2s,background .2s}
.pin:focus-within{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 6%,transparent);outline:none}
.pin .dot{grid-row:1/3;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.pin .pl{font-size:11.5px;color:var(--faint);font-weight:500}
.pin input{min-width:0;background:none;border:0;outline:none;font-weight:600;font-size:16px;color:var(--c);padding:0;height:24px}
@media (max-width:520px){.players{grid-template-columns:1fr}}

.step{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;padding:26px 28px;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .lead .n{font:500 11.5px var(--mono);color:var(--teal);letter-spacing:.1em}
.step .lead h2{font-size:17px;margin:6px 0 4px}
.step .lead p{color:var(--dim);font-size:13px;margin:0;max-width:30ch}
@media (max-width:820px){.step{grid-template-columns:1fr;gap:14px;padding:20px 16px}.step .lead p{max-width:none}}

.modes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.mode{grid-column:span 2}
.mode{position:relative;text-align:left;padding:14px;border-radius:var(--r-tile);border:1px solid var(--line);background:var(--well);
  display:flex;flex-direction:column;gap:5px;transition:border-color .2s,background .2s,transform .25s var(--out)}
.mode:hover{border-color:var(--line2);background:rgba(70,48,82,.32);transform:translateY(-1px)}
.mode .ic{width:36px;height:36px;padding:7px;border-radius:10px;background:rgba(240,154,198,.07);color:var(--teal);margin-bottom:4px;transition:background .2s}
.mode h3{font-size:15px;font-weight:700}
.mode p{margin:0;color:var(--dim);font-size:12.5px;line-height:1.45}
.mode .tag{position:absolute;top:14px;right:14px;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(255,190,92,.3);padding:2px 7px;border-radius:var(--r-pill)}
.mode[aria-pressed=true]{border-color:rgba(240,154,198,.5);background:linear-gradient(165deg,rgba(240,154,198,.11),rgba(240,154,198,.02) 70%)}
.mode[aria-pressed=true] .ic{background:rgba(240,154,198,.16)}
.mode[aria-pressed=true]::after{content:"";position:absolute;top:18px;right:16px;width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(240,154,198,.14)}
.mode[aria-pressed=true] .tag{display:none}
@media (max-width:560px){.modes{grid-template-columns:1fr 1fr}.mode{grid-column:auto;padding:12px}.mode p{font-size:12px}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:var(--h-chip);padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line2);
  background:var(--well);font-size:13.5px;font-weight:500;color:var(--dim);transition:border-color .2s,background .2s,color .2s}
.chip:hover{color:var(--bone);border-color:var(--line3)}
.chip .sw{width:8px;height:8px;border-radius:50%}
.chip small{color:var(--faint);font-size:12px;font-weight:400}
.chip[aria-pressed=true]{color:var(--bone);border-color:color-mix(in srgb,var(--c,var(--teal)) 55%,transparent);background:color-mix(in srgb,var(--c,var(--teal)) 13%,transparent)}
.chip[aria-pressed=true] small{color:var(--dim)}
.chip:disabled{opacity:.35;cursor:default}
.subj{margin-bottom:14px}
.subj:last-child{margin-bottom:0}
.subj .units{margin:10px 0 0 4px;padding-left:14px;border-left:1px solid var(--line2)}
.lbl2{font-size:12px;font-weight:500;color:var(--faint);margin:18px 0 8px;letter-spacing:.02em}
.lbl2:first-child{margin-top:0}
.opts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 22px;align-items:start}
.toggle{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--well);cursor:pointer;min-height:56px;transition:border-color .2s}
.toggle:hover{border-color:var(--line2)}
.toggle span{font-size:14px;font-weight:500}
.toggle span small{display:block;color:var(--faint);font-size:12px;font-weight:400}
.toggle input{-webkit-appearance:none;appearance:none;flex:none;width:34px;height:20px;margin:0;border-radius:99px;background:rgba(226,205,238,.14);position:relative;cursor:pointer;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:transform .25s var(--out),background .2s}
.toggle input:checked{background:rgba(240,154,198,.35)}
.toggle input:checked::after{transform:translateX(14px);background:var(--teal)}

.startbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px 16px calc(14px + var(--safe-b));pointer-events:none;
  background:linear-gradient(transparent,rgba(26,19,32,.9) 45%);display:flex;justify-content:center}
.startbar .in{pointer-events:auto;max-width:760px;width:100%;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 20px;border-radius:var(--r-tile);
  border:1px solid var(--line2);background:rgba(40,29,50,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 18px 44px -20px #000}
.startbar .count{margin-right:auto;font-size:13.5px;color:var(--dim);min-width:0;line-height:1.3}
.startbar .count b{color:var(--bone);font-family:var(--disp);font-weight:700;font-size:20px;margin-right:6px;font-variant-numeric:tabular-nums}
.startbar .count em{font-style:normal;color:var(--teal)}
@media (max-width:420px){.startbar .count{font-size:12.5px}.startbar .count .md{display:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--h-ctl);padding:0 18px;border-radius:var(--r-ctl);font-weight:600;font-size:14.5px;
  border:1px solid transparent;transition:filter .2s,background .2s,border-color .2s,transform .15s var(--ease),box-shadow .2s;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri{background:var(--teal);color:#1A1320;box-shadow:0 6px 22px -10px rgba(240,154,198,.8)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08)}
.btn.pri:disabled{background:#3A2E45;color:#8C7F99;box-shadow:none;cursor:default}
.btn.sec2{border-color:var(--line2);background:rgba(226,205,238,.03);color:var(--bone)}
.btn.sec2:hover{background:var(--hover);border-color:var(--line3)}
.btn.amb,.btn.pri.p2c{background:var(--amber);color:#2a1700}
.btn.pri.p2c{box-shadow:0 6px 22px -10px rgba(255,190,92,.8)}
.btn.bad{background:rgba(255,107,107,.12);color:var(--bad);border-color:rgba(255,107,107,.35)}
.btn.sm{min-height:calc(var(--h-ctl) - 4px);padding:0 14px;font-size:13.5px}
.btn.lg{min-height:46px;padding:0 24px;font-size:15px}
@media (pointer:coarse){.btn.sm{min-height:44px}}

/* ---------- ecran joc ---------- */
.game{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(330px,.95fr);gap:20px;max-width:1240px;margin:0 auto;padding:18px 20px calc(30px + var(--safe-b))}
.mapwrap{position:relative;padding:12px;min-height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mapwrap svg.body{width:100%;max-height:calc(100vh - 124px);height:auto}
.mapwrap::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:inherit;background:radial-gradient(circle at 50% 50%,rgba(255,107,107,.0),rgba(255,107,107,.35))}
.mapwrap.fx-flash::after{animation:flash .7s ease-out}
.side{display:flex;flex-direction:column;gap:16px}
.plates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plate{padding:12px 14px 12px;border-radius:var(--r-tile);border:1px solid var(--line);background:var(--panel2);position:relative;overflow:hidden;color:var(--c);transition:border-color .3s,box-shadow .3s}
.plate::before{content:"";position:absolute;left:14px;right:14px;top:0;height:2px;border-radius:0 0 2px 2px;background:currentColor;opacity:0;transition:opacity .3s}
.plate.on{border-color:color-mix(in srgb,currentColor 40%,transparent);box-shadow:0 10px 30px -18px currentColor}
.plate.on::before{opacity:1}
.plate .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0;color:var(--bone)}
.plate .nm .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;color:var(--c)}
.plate .nm .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate .nm .unit{margin-left:auto;font:500 10.5px var(--mono);color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.plate .sc{font-family:var(--disp);font-weight:700;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px}
.plate .meta{color:var(--faint);font-size:12px}
.plate .hp{display:flex;gap:4px;margin-top:8px}
.plate .hp i{width:16px;height:4px;border-radius:2px;background:currentColor;opacity:.9;transition:opacity .4s}
.plate .hp i.x{opacity:.14}
.turn{padding:2px 2px 0 16px;border-left:2px solid var(--c,var(--teal))}
.turn .big{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--c)}
.turn .hint{color:var(--dim);font-size:13.5px;margin-top:3px}
.turn .rd{font:500 11.5px var(--mono);color:var(--faint);letter-spacing:.08em;text-transform:uppercase;margin-top:8px}
.tray{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;border-radius:12px;border:1px solid var(--line);background:var(--well);font-size:11px;color:var(--faint);text-align:center;line-height:1.25;transition:border-color .2s,background .2s,transform .2s var(--out)}
.tool svg{width:26px;height:26px;color:var(--c);margin-bottom:2px}
.tool b{color:var(--bone);font-size:12px;font-weight:600}
.tool:hover:not(:disabled){border-color:var(--line2);transform:translateY(-1px)}
.tool[aria-pressed=true]{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}
.tool:disabled{opacity:.3;cursor:default}
.log{max-height:200px;overflow:auto;padding:4px 0 0;font-size:13px;color:var(--dim);border-top:1px solid var(--line)}
.log div{padding:6px 0;border-bottom:1px solid rgba(226,205,238,.05)}
.log div:first-child{color:var(--bone)}
.log b{color:var(--bone);font-weight:600}
@media (max-width:900px){
  .game{grid-template-columns:1fr;padding:10px 10px calc(24px + var(--safe-b));gap:12px}
  .mapwrap{min-height:0;padding:4px}
  .mapwrap svg.body{max-height:60vh}
  .plates{position:sticky;top:64px;z-index:5;order:-1}
  .side{display:contents}
}
@media (max-width:420px){.tray{gap:5px}.tool{font-size:9.5px;padding:8px 2px 6px}.tool svg{width:22px;height:22px}.tool b{font-size:10.5px}}

/* harta */
.org{cursor:pointer}
.org path,.org ellipse,.org rect{transition:fill .45s,stroke .45s,opacity .35s,stroke-width .3s}
.org .shape{fill:rgba(240,154,198,.08);stroke:rgba(236,200,230,.45);stroke-width:1.3}
.org.p1 .shape{fill:rgba(240,154,198,.30);stroke:var(--teal);stroke-width:1.9}
.org.p2 .shape{fill:rgba(255,190,92,.30);stroke:var(--amber);stroke-width:1.9}
.org.target .shape{stroke:#fff;stroke-width:2.2;stroke-dasharray:6 5;animation:march 1.1s linear infinite}
.org.dimmed{cursor:default}
.org.dimmed:not(.p1):not(.p2) .shape{opacity:.45}
.org.shield .shape{stroke:#9ad7ff;stroke-width:2.8}
.org text{font:500 10.5px var(--text);fill:var(--bone);pointer-events:none;paint-order:stroke;stroke:rgba(26,19,32,.85);stroke-width:3px}
.org .val{font:700 9.5px var(--disp);fill:var(--ink);stroke:none}
.org .valbg{fill:var(--bone)}
.org:hover .shape{filter:brightness(1.3)}
.org:focus-visible{outline:none}
.org:focus-visible .shape{stroke:var(--teal);stroke-width:3}
@keyframes march{to{stroke-dashoffset:-22}}
.silh{fill:url(#skin);stroke:rgba(236,200,230,.5);stroke-width:1.2}
.scan{animation:scan 8s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(760px)}}
body.sheet-open .scan,body.sheet-open .org.target .shape{animation-play-state:paused}
/* efecte pe hartă */
.ripple{fill:none;transform-box:fill-box;transform-origin:center;animation:ripple 1.05s var(--out) forwards;pointer-events:none}
.ripple.d2{animation-delay:.16s;opacity:0}
@keyframes ripple{0%{transform:scale(.25);opacity:.95}100%{transform:scale(2.7);opacity:0}}
.org.fx-conq .shape{animation:conq 1.2s var(--out)}
@keyframes conq{0%{filter:brightness(2.2) drop-shadow(0 0 0 var(--pc))}30%{filter:brightness(1.5) drop-shadow(0 0 9px var(--pc))}100%{filter:none}}
.org.fx-hit{animation:shake .5s var(--ease);transform-box:fill-box;transform-origin:center}
.org.fx-hit .shape{animation:hitc .6s ease-out}
@keyframes hitc{0%,40%{stroke:#fff;fill:rgba(255,107,107,.55)}100%{}}
.aim{transform-box:fill-box;transform-origin:center;animation:aim .5s var(--out) forwards;pointer-events:none}
@keyframes aim{0%{transform:scale(2.2) rotate(-50deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}

/* banner de tură, cărți de fază */
.tbanner{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));z-index:40;white-space:nowrap;max-width:calc(100vw - 24px);display:flex;align-items:center;gap:10px;padding:9px 18px 9px 14px;border-radius:var(--r-pill);
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:rgba(35,26,43,.92);font-weight:600;font-size:14px;pointer-events:none;
  box-shadow:0 14px 36px -18px var(--c);animation:bannerIn 1.7s var(--ease) forwards}
.tbanner i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.phasecard{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(26,19,32,.5),rgba(26,19,32,.85));animation:fadeIn .25s both}
.phasecard.out{animation:fadeOut .35s both}
.phasecard div{text-align:center;animation:sheetIn .5s var(--out) both}
.phasecard small{display:block;font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--pc)}
.phasecard b{display:block;font:700 clamp(32px,6vw,58px)/1.05 var(--disp);margin:10px 0 8px;color:var(--bone)}
.phasecard span{color:var(--dim);font-size:15px}
.fxflash{position:fixed;inset:0;z-index:58;pointer-events:none;animation:flash .6s ease-out forwards}
canvas.fxc{position:fixed;inset:0;z-index:88;pointer-events:none;width:100%;height:100%}

/* ---------- foaia de întrebare ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(12,6,16,.76);animation:fadeIn .22s ease both}
.sheet .card{animation:sheetIn .34s var(--out) both}
.sheet.out{animation:fadeOut .16s ease both;pointer-events:none}
.sheet.out .card{animation:sheetOut .16s ease both}
.card{width:min(860px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:24px 26px;border-radius:var(--r-card);border:1px solid var(--line2);
  background:linear-gradient(165deg,rgba(52,37,62,.97),rgba(35,26,43,.98));box-shadow:0 30px 80px -30px #000,inset 0 1px 0 rgba(255,255,255,.04)}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:14px}
.who{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;margin-right:4px}
.who .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor;background:currentColor}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--dim);border:1px solid var(--line2);border-radius:var(--r-pill);padding:3px 10px;line-height:1.3}
.pill.hot{color:var(--warn);border-color:rgba(255,209,102,.35)}
.timer{margin-left:auto;font-family:var(--mono);font-size:19px;padding:3px 12px;border-radius:var(--r-ctl);border:1px solid var(--line2);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);border-color:rgba(255,107,107,.5)}
.qtext{font-size:clamp(17px,2.2vw,20px);line-height:1.5;font-weight:600;margin:4px 0 16px;letter-spacing:-.005em}
.qimg{position:relative;margin:0 0 16px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000;cursor:zoom-in}
.qimg img{display:block;width:100%;max-height:46vh;object-fit:contain}
.qimg .zoom{position:absolute;right:8px;bottom:8px;font-size:12px;background:rgba(0,0,0,.6);padding:3px 9px;border-radius:var(--r-pill)}
.qkind{display:flex;align-items:center;gap:8px;font:500 11.5px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin:0 0 10px}
.qkind i{flex:none;width:11px;height:11px;border:1.5px solid currentColor;border-radius:3px}
.qkind.cs{color:#9ad7ff}.qkind.cs i{border-radius:50%}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;min-height:48px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--well);font-size:15px;line-height:1.45;
  transition:border-color .2s,background .2s}
.opt:hover:not(.r-ok):not(.r-miss):not(.r-bad):not(.r-fine){border-color:var(--line2);background:rgba(70,48,82,.3)}
.opt .k{flex:none;width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:13px;border:1px solid var(--line3);color:var(--dim);transition:background .2s,color .2s,border-color .2s}
.opt[aria-pressed=true]{border-color:rgba(240,154,198,.5);background:rgba(240,154,198,.08);animation:press .25s var(--ease)}
.opt[aria-pressed=true] .k{background:var(--teal);color:var(--ink);border-color:var(--teal);animation:pop .3s var(--out)}
.opt.r-ok,.opt.r-miss,.opt.r-bad,.opt.r-fine{animation:resIn .42s var(--out) both;animation-delay:calc(var(--i,0) * 60ms)}
.opt.r-ok{border-color:rgba(94,232,160,.55);background:rgba(94,232,160,.09)}
.opt.r-miss{border-color:rgba(255,209,102,.5);background:rgba(255,209,102,.07)}
.opt.r-bad{border-color:rgba(255,107,107,.55);background:rgba(255,107,107,.09)}
.opt.r-fine{opacity:.55}
.opt .res{margin-left:auto;font-size:12px;font-weight:500;white-space:nowrap;padding-left:8px;align-self:center}
.opt.r-ok .res{color:var(--ok)}.opt.r-miss .res{color:var(--warn)}.opt.r-bad .res{color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center;margin-top:18px}
.actions .grow{margin-right:auto;color:var(--faint);font-size:13px}
.why{margin-top:14px;padding:12px 16px;border-radius:12px;background:var(--well);border:1px solid var(--line);font-size:14.5px;color:#E2D8EA;animation:screenIn .5s .15s var(--out) both}
.verdict{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin-top:16px;padding:12px 16px;border-radius:12px;font-family:var(--disp);font-weight:700;font-size:18px;animation:verdictIn .55s var(--out) both}
.verdict .vs{font-variant-numeric:tabular-nums}
.verdict.ok{background:rgba(94,232,160,.10);color:var(--ok);border:1px solid rgba(94,232,160,.25)}
.verdict.no{background:rgba(255,107,107,.10);color:var(--bad);border:1px solid rgba(255,107,107,.25)}
.verdict small{font-family:var(--text);font-weight:400;font-size:13px;color:var(--dim)}
.speak{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;border:1px dashed var(--line3);color:var(--dim);font-size:14px}
.speak svg{width:30px;height:30px;color:var(--teal);flex:none}
.kp{display:grid;gap:6px}
.kp .stage{font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:12px 0 2px}
.kp label{display:flex;gap:12px;align-items:flex-start;min-height:46px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--well);cursor:pointer;font-size:15px;line-height:1.45;transition:border-color .2s,background .25s}
.kp label:hover{border-color:var(--line2)}
.kp input{-webkit-appearance:none;appearance:none;flex:none;width:20px;height:20px;margin:1px 0 0;border-radius:6px;border:1.5px solid var(--line3);background:transparent;cursor:pointer;display:grid;place-items:center;transition:background .2s,border-color .2s}
.kp input::after{content:"";width:10px;height:6px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .25s var(--out)}
.kp input:checked{background:var(--ok);border-color:var(--ok);animation:pop .3s var(--out)}
.kp input:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.kp input:disabled{cursor:default}
.kp label:has(input:checked){border-color:rgba(94,232,160,.45);background:rgba(94,232,160,.07)}
.meter{position:relative;height:8px;border-radius:99px;background:rgba(226,205,238,.10);margin:16px 0 6px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--bad);transition:width .35s var(--out),background .3s,box-shadow .3s}
.meter i.pass{background:var(--ok);box-shadow:0 0 14px -2px rgba(94,232,160,.7)}
.meter b{position:absolute;left:75%;top:-5px;bottom:-5px;width:1.5px;background:var(--bone);opacity:.7}
.meterlab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
details.model{margin-top:14px;border-radius:12px;border:1px solid var(--line);background:var(--well)}
details.model summary{cursor:pointer;padding:11px 14px;font-weight:500;font-size:14px}
details.model div{padding:0 16px 14px;font-size:14.5px;line-height:1.6;white-space:pre-wrap}
details.model strong{color:var(--teal)}
.src{margin-top:10px;font-size:12px;color:var(--faint)}
@media (max-width:640px){.sheet{padding:0;align-items:stretch}.card{max-height:none;height:100%;border-radius:0;border:0;padding:16px 14px calc(18px + var(--safe-b))}.actions .btn{flex:1}.actions .grow{flex-basis:100%}}

.lightbox{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:fadeIn .2s both}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}

/* pariu */
.bets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.bet{padding:14px 8px;border-radius:var(--r-tile);border:1px solid var(--line);background:var(--well);text-align:center;transition:border-color .2s,transform .2s var(--out),background .2s}
.bet b{display:block;font-family:var(--disp);font-size:26px;font-weight:700}
.bet span{font-size:12.5px;color:var(--dim)}
.bet:hover{border-color:rgba(240,154,198,.5);transform:translateY(-2px);background:rgba(240,154,198,.05)}
.bet.allin{grid-column:1/-1;border-color:rgba(255,209,102,.3)}
.bet.allin b{font-size:16px;color:var(--warn)}

/* circuit */
.station{text-align:center;padding:28px 20px}
.station .phase{font-weight:500;font-size:14px;color:var(--dim)}
.station .clock{font-family:var(--mono);font-size:clamp(56px,12vw,100px);line-height:1;margin:10px 0;font-variant-numeric:tabular-nums}
.station .clock.last{color:var(--warn)}
.ring{height:4px;border-radius:99px;background:rgba(226,205,238,.10);overflow:hidden;margin:12px auto 0;max-width:480px}
.ring i{display:block;height:100%;background:var(--teal);transition:width 1s linear}
.banner{margin:16px auto 0;max-width:480px;padding:10px 14px;border-radius:12px;background:rgba(255,209,102,.10);border:1px solid rgba(255,209,102,.25);color:var(--warn);font-weight:600;animation:screenIn .4s var(--out) both}
.rules{display:grid;gap:8px;font-size:14px;color:var(--dim);text-align:left;max-width:560px;margin:18px auto 0}
.rules div{padding-left:14px;border-left:1px solid var(--line2)}

/* boss */
.boss{position:relative;padding:22px 24px 20px;border-radius:var(--r-card);border:1px solid color-mix(in srgb,var(--bc) 28%,transparent);overflow:hidden;
  background:radial-gradient(640px 240px at 12% 0%,color-mix(in srgb,var(--bc) 13%,transparent),transparent 70%),linear-gradient(180deg,rgba(48,35,58,.5),rgba(35,26,43,.45))}
.boss.hit{animation:shake .5s var(--ease)}
.boss.lunge{animation:lunge .6s var(--ease)}
@keyframes lunge{0%,100%{transform:none}30%{transform:scale(1.025)}}
.bhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.bhead .eyebrow{color:var(--bc)}
.bname{font-size:clamp(26px,4vw,38px);line-height:1.05;margin-top:8px}
.vitals{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.vitals .vl{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.vitals .vv{display:flex;gap:6px}
.vital{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:1px solid rgba(94,232,160,.35);color:var(--ok);background:rgba(94,232,160,.06);transition:all .4s}
.vital svg{width:18px;height:18px}
.vital.lost{color:var(--faint);border-color:var(--line);background:transparent;opacity:.5}
.vital.break{animation:vbreak .9s var(--ease) both}
@keyframes vbreak{0%{transform:scale(1);color:var(--bad);border-color:var(--bad);background:rgba(255,107,107,.2);opacity:1}30%{transform:scale(1.25)}100%{transform:scale(1)}}
.ekg{height:54px;margin:14px -24px 10px;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 80%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 80%,transparent)}
.ekg svg{display:block;width:200%;height:100%;animation:ekg var(--ekg,3s) linear infinite}
.ekg path{fill:none;stroke:var(--bc);stroke-width:1.6;stroke-linejoin:round;filter:drop-shadow(0 0 4px var(--bc))}
@keyframes ekg{to{transform:translateX(-50%)}}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.ph{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-ctl);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--faint);min-width:0}
.ph span{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:600 10.5px var(--mono);border:1px solid var(--line2)}
.ph em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph.cur{color:var(--bone);border-color:color-mix(in srgb,var(--bc) 45%,transparent);background:color-mix(in srgb,var(--bc) 9%,transparent)}
.ph.cur span{background:var(--bc);color:var(--ink);border-color:var(--bc)}
.ph.done{text-decoration:line-through;text-decoration-color:var(--faint)}
.ph.done span{color:var(--ok);border-color:rgba(94,232,160,.4)}
.hpbar{position:relative;height:10px;border-radius:99px;background:rgba(226,205,238,.08);overflow:hidden}
.hpbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.hpbar .ghost{background:rgba(255,255,255,.35);transition:width .8s .35s var(--ease)}
.hpbar .fill{background:linear-gradient(90deg,color-mix(in srgb,var(--bc) 70%,#000),var(--bc));transition:width .5s var(--out);box-shadow:0 0 14px -2px var(--bc)}
.hpl{display:flex;justify-content:space-between;margin-top:7px;font-size:12.5px;color:var(--dim)}
.hpl b{font-family:var(--mono);font-weight:400;color:var(--bone);font-variant-numeric:tabular-nums}
.dmg{position:absolute;left:50%;top:44%;font:700 34px var(--disp);color:var(--bone);text-shadow:0 0 18px var(--bc);pointer-events:none;animation:floatUp 1.2s var(--out) forwards}
.dmg.miss{font-size:18px;color:var(--dim);text-shadow:none}
.bturn{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:20px 0 16px}
@media (max-width:560px){.phases{display:flex}.ph{flex:0 0 auto}.ph.cur{flex:1}.ph:not(.cur) em{display:none}.boss{padding:18px 16px}.ekg{margin:12px -16px 8px}.vitals{margin-left:0;align-items:flex-start}.bturn .btn{flex:1}}
.bturn > div{flex:1;min-width:220px}

/* bomba */
.arena{display:grid;grid-template-columns:1fr minmax(150px,240px) 1fr;align-items:center;gap:10px;padding:22px 20px}
.bp{padding:14px;border-radius:var(--r-tile);border:1px solid var(--line);text-align:center;color:var(--c);transition:border-color .4s,background .4s,box-shadow .4s}
.bp .nm{font-weight:600;color:var(--bone);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp .pips{display:flex;justify-content:center;gap:5px;margin-top:10px}
.bp .pips i{width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor;opacity:.5}
.bp .pips i.w{background:currentColor;opacity:1}
.bp .st{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:8px}
.bp.hold{border-color:color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 7%,transparent);box-shadow:0 12px 32px -20px var(--c)}
.bp.hold .st{color:var(--c)}
.bombwrap{display:flex;justify-content:center;transition:transform .8s var(--out)}
.bombwrap[data-side="0"]{transform:translateX(-14%) rotate(-8deg)}
.bombwrap[data-side="1"]{transform:translateX(14%) rotate(8deg) scaleX(-1)}
.bombsvg{width:100%;max-width:170px;height:auto;overflow:visible}
.bombsvg .spark{transform-box:fill-box;transform-origin:center;animation:spark .18s steps(2) infinite}
@keyframes spark{50%{transform:scale(.7);opacity:.75}}
.bombsvg .bglow{fill:none;stroke:rgba(255,190,92,.25);stroke-width:1;animation:bglow 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bglow{50%{transform:scale(1.08);opacity:.2}}
.bombpill{color:var(--bone);border-color:rgba(255,140,90,.5);background:rgba(255,120,80,.08)}
.bombpill i{width:8px;height:8px;border-radius:50%;background:var(--heat,#FFBE5C);box-shadow:0 0 10px var(--heat,#FFBE5C);animation:beat var(--beat,1s) ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(.7)}50%{transform:scale(1.25)}}
.danger{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;box-shadow:inset 0 0 min(140px,24vw) min(30px,4vw) rgba(255,80,70,.55);animation:dpulse var(--beat,1s) ease-in-out infinite}
@keyframes dpulse{50%{filter:brightness(1.35)}}
.boomcard{text-align:center;padding:34px 20px}

const reduced=()=>!!(Setup.reduced||MQ.matches);
function toast(t,ms=2200){const e=h(`<div class="toast" role="status">${esc(t)}</div>`);document.body.append(e);setTimeout(()=>e.remove(),ms)}
/* schimbă ecranul; animă doar la intrarea pe un ecran nou */
function mount(node,anim){const app=$("#app");app.innerHTML="";if(anim&&!reduced()){node.classList.add("enter")}app.append(node);if(anim)window.scrollTo(0,0);return node}
/* scorul crește numărând */
/* dec = numărul de zecimale (afișate cu virgulă, ca la note: 7,35) */
const nfmt=(v,dec)=>dec?Number(v).toFixed(dec).replace(".",","):String(Math.round(v));
function countUp(el,from,to,ms=700,dec=0){from=+from||0;to=+to||0;
  if(from===to||reduced()){el.textContent=nfmt(to,dec);return}
  const t0=performance.now();const step=now=>{const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=nfmt(from+(to-from)*e,dec);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function animateScores(root){$$("[data-to]",root).forEach(el=>countUp(el,el.dataset.from,el.dataset.to,+el.dataset.ms||700,+el.dataset.dec||0))}

/* ============================ sunet: efecte (WebAudio, moi, ușoare pentru AnyDesk) ============================ */
const Snd={
  ctx:null, bus:null, nb:null,
  sfx:store.get("sfx",true), mus:store.get("mus",false),
  sfxVol:store.get("sfxVol",.7), musVol:store.get("musVol",.55),
  init(){
    if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    const c=this.ctx;if(!c)return null;
    if(!this.bus){this.bus=c.createGain();this.bus.gain.value=this.sfxVol;
      const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=4200;lp.Q.value=.4;this.bus.connect(lp);lp.connect(c.destination)}
    if(c.state==="suspended"&&c.resume)c.resume().catch(()=>{});
    return c},
  setSfxVol(v){this.sfxVol=v;store.set("sfxVol",v);if(this.bus)this.bus.gain.setTargetAtTime(v,this.ctx.currentTime,.05)},
  setMusVol(v){this.musVol=v;store.set("musVol",v);Lofi.setVol(v)},
  noise(){if(!this.nb){const c=this.ctx,n=c.sampleRate,b=c.createBuffer(1,n,n),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;this.nb=b}return this.nb},
  on(){return this.sfx&&this.sfxVol>0},
  tone(f,d=.12,type="sine",v=.12,delay=0,f2=0){if(!this.on())return;const c=this.init();if(!c)return;
    const t=c.currentTime+delay+.005,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.9);
    const a=Math.min(.02,d*.25);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.bus);o.start(t);o.stop(t+d+.05)},
  bell(f,v=.06,delay=0,d=.8){this.tone(f,d,"sine",v,delay);this.tone(f*2.005,d*.45,"sine",v*.22,delay)},
  nz(d,v,f1,f2,type="lowpass",delay=0,q=.7){if(!this.on())return;const c=this.init();if(!c)return;const t=c.currentTime+delay+.005;
    const s=c.createBufferSource();s.buffer=this.noise();const fl=c.createBiquadFilter();fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f1,t);
    if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(this.bus);s.start(t,Math.random()*.4);s.stop(t+d+.05)},
  click(){this.tone(1180,.05,"sine",.03,0,880)},
  ok(){this.bell(698.46,.055,0,.8);this.bell(880,.05,.07,.8);this.bell(1046.5,.045,.14,1.1)},
  bad(){this.tone(311,.34,"sine",.07,0,262);this.tone(233,.46,"triangle",.04,.1,196)},
  win(){[349.23,440,523.25,659.25,783.99,1046.5].forEach((f,i)=>this.bell(f,.045,i*.085,1.4))},
  alarm(){[0,.3,.6].forEach(d=>this.bell(987.77,.05,d,.4))},
  tick(){this.tone(1600,.035,"sine",.026,0,1250)},
  power(){this.tone(500,.25,"sine",.05,0,1000);this.bell(1000,.03,.14,.6)},
  wood(v=.05){this.tone(1050,.06,"triangle",v,0,720)},
  whoosh(){this.nz(.38,.03,500,2200,"bandpass",0,1.2)},
  hit(){this.tone(170,.24,"sine",.12,0,70);this.nz(.14,.03,2400,600,"bandpass");this.bell(1318.5,.025,.05,.4)},
  hurt(){this.tone(150,.6,"triangle",.08,0,70);this.nz(.45,.03,900,200)},
  boom(){this.tone(92,1.1,"sine",.2,0,32);this.nz(1.4,.16,2400,80);this.nz(.3,.06,5200,900)},
  phase(){[523.25,415.3,349.23].forEach((f,i)=>this.bell(f,.045,i*.13,1))},
  music(on){on?Lofi.start():Lofi.stop()}
};

/* ============================ muzică lo-fi procedurală (fără fișiere, fără rețea) ============================
   76 BPM, swing ușor pe șaisprezecimi, ii–V–I–vi în Fa (Gm9 · C13 · Fmaj9 · Dm9) pe electric piano
   (sinus + triunghi ușor dezacordat, atac moale, lowpass ~1,75 kHz, tremolo), bas moale, tobe sintetizate,
   crackle și hiss de vinil, wow de casetă (LFO lent care modulează o linie de întârziere = variație de pitch),
   lowpass + compresor blând pe master. Scheduler cu lookahead: setInterval 25 ms, programează ~0,12 s înainte. */
const Lofi={
  on:false,c:null,N:null,iv:0,s:0,t:0,BPM:76,mot:null,pat:null,
  get sd(){return 60/this.BPM/4},
  CH:[{b:43,v:[58,62,65,69],m:[67,70,74,77,69]},  /* Gm9 */
      {b:36,v:[58,62,64,69],m:[64,67,70,74,69]},  /* C13 */
      {b:41,v:[57,60,64,67],m:[65,69,72,76,67]},  /* Fmaj9 */
      {b:38,v:[53,57,60,64],m:[62,65,69,72,76]}], /* Dm9 */
  MOT:[[[0,2,3],[3,1,2],[6,0,4],[12,1,3]],
       [[2,3,2],[4,2,2],[8,1,6]],
       [[0,0,1],[2,1,1],[4,2,2],[7,3,3],[12,2,3]],
       [[4,4,2],[6,2,2],[10,1,2],[14,0,2]],
       [[0,1,4],[6,2,2],[9,3,5]]],
  mf(m){return 440*Math.pow(2,(m-69)/12)},
  build(c,dest){
    const G=v=>{const x=c.createGain();x.gain.value=v;return x};
    const F=(type,f,q=.7)=>{const x=c.createBiquadFilter();x.type=type;x.frequency.value=f;x.Q.value=q;return x};
    const N={lfos:[]};
    N.out=G(0);N.out.connect(dest);
    N.comp=c.createDynamicsCompressor();N.comp.threshold.value=-20;N.comp.knee.value=12;N.comp.ratio.value=3;N.comp.attack.value=.015;N.comp.release.value=.25;N.comp.connect(N.out);
    N.lp=F("lowpass",4800,.35);N.lp.connect(N.comp);
    /* wow + flutter de casetă */
    N.wow=c.createDelay(.1);N.wow.delayTime.value=.014;N.wow.connect(N.lp);
    const lfo=(f,depth,target)=>{const o=c.createOscillator();o.frequency.value=f;const d=G(depth);o.connect(d);d.connect(target);o.start();N.lfos.push(o);return o};
    lfo(.42,.0018,N.wow.delayTime);lfo(5.6,.00005,N.wow.delayTime);
    N.bus=G(.9);N.bus.connect(N.wow);
    /* electric piano: lowpass + tremolo */
    N.ep=G(.8);N.epLP=F("lowpass",1750,.5);N.trem=G(.9);N.ep.connect(N.epLP);N.epLP.connect(N.trem);N.trem.connect(N.bus);
    lfo(4.3,.1,N.trem.gain);
    N.bass=G(.55);const bl=F("lowpass",420,.6);N.bass.connect(bl);bl.connect(N.bus);
    N.dr=G(.62);N.dr.connect(N.lp);
    N.snBP=F("bandpass",1800,.8);N.snBP.connect(N.dr);
    N.hatHP=F("highpass",5200,.5);N.hatHP.connect(N.dr);
    const n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;N.nb=b;
    /* vinil: hiss continuu foarte încet + pocnituri rare */
    N.crk=F("highpass",1800,.5);N.crk.connect(N.lp);
    const hs=c.createBufferSource();hs.buffer=b;hs.loop=true;const h1=F("highpass",1100,.3),h2=F("lowpass",5200,.3),hg=G(.011);
    hs.connect(h1);h1.connect(h2);h2.connect(hg);hg.connect(N.lp);hs.start();N.hiss=hs;
    return N},
  ep(t,m,v,dur,bright=0){const c=this.c,N=this.N,f=this.mf(m);
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.setTargetAtTime(v*.4,t+.04,.5);g.gain.setTargetAtTime(0,t+dur,.3);g.connect(N.ep);
    const o1=c.createOscillator();o1.frequency.value=f;o1.connect(g);
    const o2=c.createOscillator();o2.type="triangle";o2.frequency.value=f;o2.detune.value=7;const g2=c.createGain();g2.gain.value=.3;o2.connect(g2);g2.connect(g);
    const o3=c.createOscillator();o3.frequency.value=f*2;const g3=c.createGain();g3.gain.setValueAtTime(v*(.25+bright),t);g3.gain.exponentialRampToValueAtTime(.0001,t+.35);o3.connect(g3);g3.connect(N.ep);
    const end=t+dur+1.4;o1.start(t);o2.start(t);o3.start(t);o1.stop(end);o2.stop(end);o3.stop(t+.4)},
  bass(t,m,dur,v){const c=this.c,f=this.mf(m),g=c.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.setTargetAtTime(v*.6,t+.05,.3);g.gain.setTargetAtTime(0,t+dur,.08);g.connect(this.N.bass);
    const o=c.createOscillator();o.frequency.value=f;o.connect(g);const o2=c.createOscillator();o2.type="triangle";o2.frequency.value=f;const g2=c.createGain();g2.gain.value=.22;o2.connect(g2);g2.connect(g);
    o.start(t);o2.start(t);o.stop(t+dur+.6);o2.stop(t+dur+.6)},
  kick(t,v){const c=this.c,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(52,t+.11);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(this.N.dr);o.start(t);o.stop(t+.35)},
  nsrc(t,dur,rate=1){const s=this.c.createBufferSource();s.buffer=this.N.nb;s.playbackRate.value=rate;s.start(t,Math.random()*1.5);s.stop(t+dur);return s},
  snare(t,v){const c=this.c,g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);this.nsrc(t,.22).connect(g);g.connect(this.N.snBP);
    const o=c.createOscillator();o.type="triangle";o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(160,t+.08);const g2=c.createGain();g2.gain.setValueAtTime(v*.35,t);g2.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(g2);g2.connect(this.N.dr);o.start(t);o.stop(t+.1)},
  hat(t,v,open){const c=this.c,g=c.createGain(),d=open?.24:.05;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);this.nsrc(t,d+.02).connect(g);g.connect(this.N.hatHP)},
  crackle(t){const c=this.c,g=c.createGain(),v=.015+Math.random()*.05;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+.008);this.nsrc(t,.012,.5+Math.random()).connect(g);g.connect(this.N.crk)},
  newPhrase(ph){const R=Math.random;this.mot=this.MOT[Math.floor(R()*this.MOT.length)];
    this.pat={k:R()<.5?[0,10]:[0,7,10],rh:R()<.5?10:(R()<.5?6:0),b5:R()<.5,mb:ph===0?[]:(ph%2?[1,3]:[2,3]),mo:Math.floor(R()*3)}},
  step(s,t){const sd=this.sd,st=s%16,bar=Math.floor(s/16),bi=bar%4,ph=Math.floor(bar/4),ch=this.CH[bi],R=Math.random,P=this.pat;
    if(st===0&&bi===0)this.newPhrase(ph);
    const tt=t+((st%2)?sd*.2:0);
    if(P.k.includes(st))this.kick(tt,st===0?.42:.3);
    if(st===4||st===12)this.snare(tt+.018,.3*(.9+R()*.2));
    if(st%2===0)this.hat(tt,(st%4===0?.11:.075)*(.8+R()*.4),st===14&&bi%2===1);
    else if(R()<.1)this.hat(tt,.028);
    if(st===0)ch.v.forEach((m,i)=>this.ep(t+.006+i*.022+R()*.008,m,.11-i*.007,sd*15.2));
    if(P.rh&&st===P.rh)ch.v.slice(1).forEach((m,i)=>this.ep(tt+i*.015,m,.045,sd*4));
    if(st===0)this.bass(t,ch.b,sd*5.5,.24);
    if(st===7)this.bass(tt,ch.b+(P.b5?7:12),sd*2,.15);
    if(st===10)this.bass(tt,ch.b,sd*3.5,.18);
    if(st===14&&bi===3)this.bass(tt,this.CH[0].b-1,sd*2,.13);
    if(P.mb.includes(bi))for(const [s0,ni,len] of this.mot)if(s0===st)this.ep(tt+.01,ch.m[(ni+P.mo)%ch.m.length],.075,sd*len*1.6,.3);
    if(R()<.11)this.crackle(t+R()*sd)},
  pump(){const c=this.c;if(!c||!this.N)return;
    if(this.t<c.currentTime-.05)this.t=c.currentTime+.05; /* după o pauză a tabului, sari peste notele pierdute */
    const until=c.currentTime+.12;while(this.t<until){this.step(this.s,this.t);this.t+=this.sd;this.s++}},
  lvl(v){return v*1.1},
  start(){const c=Snd.init();if(!c||this.on)return;this.on=true;this.c=c;this.N=this.build(c,c.destination);
    const now=c.currentTime;this.N.out.gain.setValueAtTime(0,now);this.N.out.gain.linearRampToValueAtTime(this.lvl(Snd.musVol),now+2.5);
    this.s=0;this.t=now+.12;this.newPhrase(0);clearInterval(this.iv);this.iv=setInterval(()=>this.pump(),25);syncSoundBtns()},
  stop(){if(!this.on)return;this.on=false;clearInterval(this.iv);const N=this.N,c=this.c;this.N=null;
    if(N){const now=c.currentTime;N.out.gain.cancelScheduledValues(now);N.out.gain.setValueAtTime(N.out.gain.value,now);N.out.gain.linearRampToValueAtTime(0,now+.6);
      setTimeout(()=>{try{N.lfos.forEach(o=>o.stop());N.hiss.stop();N.out.disconnect()}catch(e){}},800)}
    syncSoundBtns()},
  setVol(v){if(this.N)this.N.out.gain.setTargetAtTime(this.lvl(v),this.c.currentTime,.08)}
};

/* ============================ panoul de sunet (volum muzică / efecte, mute separat) ============================ */
const SPK_ON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg>`;
const SPK_OFF=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>`;
function syncSoundBtns(){const b=$("#bMus");if(!b)return;const silent=!(Snd.mus&&Lofi.on);b.classList.toggle("off",silent&&!Snd.sfx);b.querySelector(".eq").classList.toggle("hidden",silent);
  const p=$("#sndpop");if(p){for(const k of ["mus","sfx"]){const on=Snd[k],m=$("#m_"+k,p);m.setAttribute("aria-pressed",on);m.innerHTML=on?SPK_ON:SPK_OFF;$("#v_"+k,p).classList.toggle("muted",!on)}}}
function closeSnd(){const p=$("#sndpop");if(p){p.remove();$("#bMus").setAttribute("aria-expanded","false")}document.removeEventListener("pointerdown",sndOutside,true)}
function sndOutside(e){const p=$("#sndpop");if(p&&!p.contains(e.target)&&!$("#bMus").contains(e.target))closeSnd()}
function soundPanel(){
  if($("#sndpop"))return closeSnd();
  const row=(k,label,v)=>`<div class="srow"><button class="mute" id="m_${k}" aria-label="${label}: pornit / oprit"></button>
    <div class="sl"><div class="slh"><label for="v_${k}">${label}</label><output id="o_${k}">${Math.round(v*100)}%</output></div>
    <input type="range" id="v_${k}" min="0" max="100" step="1" value="${Math.round(v*100)}" style="--v:${Math.round(v*100)}%" aria-label="Volum ${label.toLowerCase()}"></div></div>`;
  const p=h(`<div class="sndpop" id="sndpop" role="dialog" aria-label="Sunet"><div class="sp-h"><b>Sunet</b><span>Lo-fi generat în browser, fără fișiere și fără internet</span></div>
    ${row("mus","Muzică lo-fi",Snd.musVol)}${row("sfx","Efecte sonore",Snd.sfxVol)}<p class="note">Valorile rămân salvate în acest browser.</p></div>`);
  const r=$("#bMus").getBoundingClientRect();
  if(innerWidth<520){p.style.left="10px";p.style.right="10px";p.style.width="auto"}else{p.style.right=Math.max(10,innerWidth-r.right)+"px"}
  p.style.top=(r.bottom+8)+"px";
  document.body.append(p);$("#bMus").setAttribute("aria-expanded","true");
  $("#m_mus",p).onclick=()=>{Snd.mus=!Snd.mus;store.set("mus",Snd.mus);Snd.music(Snd.mus);syncSoundBtns()};
  $("#m_sfx",p).onclick=()=>{Snd.sfx=!Snd.sfx;store.set("sfx",Snd.sfx);syncSoundBtns();Snd.click()};
  const sl=(k,set)=>{const i=$("#v_"+k,p);i.oninput=()=>{const v=i.value/100;i.style.setProperty("--v",i.value+"%");$("#o_"+k,p).textContent=i.value+"%";set(v);
      if(v>0&&!Snd[k]){Snd[k]=true;store.set(k,true);if(k==="mus")Snd.music(true);syncSoundBtns()}}};
  sl("mus",v=>Snd.setMusVol(v));sl("sfx",v=>Snd.setSfxVol(v));
  $("#v_sfx",p).onchange=()=>Snd.ok();
  syncSoundBtns();
  setTimeout(()=>document.addEventListener("pointerdown",sndOutside,true),0)}
$("#bMus").onclick=()=>{Snd.init();soundPanel()};
document.addEventListener("pointerdown",()=>{Snd.init();if(Snd.mus&&!Lofi.on)Snd.music(true)},{once:true});

/* ============================ efecte vizuale (ieftine; oprite la „Animații reduse”) ============================ */
const FX={
  cv:null,cx:null,ps:[],raf:0,
  canvas(){if(!this.cv){this.cv=document.createElement("canvas");this.cv.className="fxc";document.body.append(this.cv);this.cx=this.cv.getContext("2d")}
    const k=Math.min(1.5,window.devicePixelRatio||1);this.k=k;this.cv.width=innerWidth*k;this.cv.height=innerHeight*k;return this.cx},
  burst(x,y,cols,n=40,o={}){if(reduced())return;this.canvas();
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(o.sp||5)*(.35+Math.random());
      this.ps.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up||1.5),g:o.g??.09,dr:.985,life:0,max:(o.life||70)*(.6+Math.random()*.6),r:(o.r||2.4)*(.5+Math.random()),c:cols[i%cols.length]})}
    this.run()},
  celebrate(cols){if(reduced())return;const W=innerWidth,H=innerHeight;
    [[.5,.42],[.28,.5],[.72,.5]].forEach(([fx,fy],i)=>setTimeout(()=>this.burst(W*fx,H*fy,cols.concat("#F3ECF6"),i?34:46,{sp:6,life:80,r:2.6}),i*260));

function poolMeta(){

    for(const m of u.q){ const [id,ti,df,hot,ty,st]=m; const tkey=u.id+"|"+ti;

  if(!Setup.sim||typeof Setup.sim!=="object")Setup.sim={};

function simAvail(){const a={},sub={};IDX().forEach(u=>sub[u.id]=u.subject);
  for(const m of poolMeta()){if(m.ty!=="m")continue;const s=sub[m.unit];a[s]=(a[s]||0)+1}return a}
/* cât intră efectiv pe fiecare rând: aceeași materie în mai multe rânduri împarte aceleași grile */
function simPlan(avail){const S=simState(),left={...avail};let total=0;
  const blocks=S.blocks.map(b=>{const rows=b.rows.map(r=>{const want=Math.max(0,Math.floor(+r.n||0)),eff=Math.min(want,Math.max(0,left[r.s]||0));
      left[r.s]=(left[r.s]||0)-eff;total+=eff;return {s:r.s,want,eff,avail:avail[r.s]||0}});
    return {rows,total:rows.reduce((x,r)=>x+r.eff,0)}});
  return {blocks,total,nBlocks:blocks.filter(b=>b.total>0).length}}
function simSeconds(n){const S=simState();return S.time==="none"?0:S.time==="custom"?Math.max(1,Math.round(+S.custom||0))*60:Math.round(n*60*(+S.time||1))}
function updSimBar(P){const c=$("#sbCount");if(c)c.innerHTML=`<b>${P.total}</b>${wGr(P.total)} · ${nBl(P.nBlocks)}<span class="md"> · <em>Simulare UNIX</em></span>`;
  const b=$("#sbGo");if(b)b.disabled=!P.total}

function simBuilder(root){

  const touch=()=>{S.touched=true;saveSetup()};
  const box=h(`<div class="simb"></div>`);root.append(box);
  const firstFree=(used)=>subs.find(s=>!used.includes(s))||subs[0];
  const refresh=()=>{const P=simPlan(avail);
    $$(".sblock",box).forEach((el,bi)=>{const pb=P.blocks[bi];if(!pb)return;
      $$(".sr",el).forEach((re,ri)=>{const pr=pb.rows[ri];if(!pr)return;$(".sav",re).textContent=`din ${pr.avail} disponibile`;
        const w=$(".swarn",re),msg=!pr.avail?"Materia nu are grile în materialul și filtrele alese.":pr.eff<pr.want?`Ai cerut ${pr.want}, dar sunt disponibile doar ${pr.eff}: intră ${nGr(pr.eff)}.`:"";
        w.textContent=msg;w.classList.toggle("hidden",!msg)});
      $(".sbtot",el).innerHTML=`<b>${pb.total}</b>${wGr(pb.total)}`});
    const sec=simSeconds(P.total),tt=$("#sTT",box);
    if(tt)tt.textContent=S.time==="none"?"Cronometrul doar măsoară timpul folosit.":P.total?`Timp total: ${fmtDur(sec)}${S.time==="custom"?` · ~${(sec/60/P.total).toFixed(1).replace(".",",")} min / grilă`:""}`:"";
    updSimBar(P)};
  const draw=()=>{
    const tpls=store.get("simTpl",[]);
    const opts=cur=>(subs.includes(cur)?subs:[...subs,cur]).map(s=>`<option value="${esc(s)}" ${s===cur?"selected":""}>${esc(subjName(s))}${avail[s]?"":" (nu e în material)"}</option>`).join("");
    box.innerHTML=`<p class="simnote">Joci singur, ca <b style="color:var(--p1)">${esc(Setup.p1)}</b>. Intră doar grilele din materialul și filtrele alese; întrebările orale nu intră.</p>
      <div class="sblocks">${S.blocks.map((b,bi)=>`<div class="sblock ${b.sep?"sep":""}">
        <div class="sbh"><input class="sbname" value="${esc(b.name)}" maxlength="40" aria-label="Numele blocului" spellcheck="false"><span class="sbtag ${b.sep?"":"blk"}">${b.sep?"materie separată":"bloc · o notă"}</span>
          <button class="btn sec2 sm delb">Șterge ${b.sep?"materia":"blocul"}</button></div>
        <div class="srows">${b.rows.map(r=>`<div class="sr"><span class="sw" style="background:${subjColor(r.s)};color:${subjColor(r.s)}"></span>
            <select class="ssel" aria-label="Materia">${opts(r.s)}</select>
            <input class="num" type="number" min="0" step="1" inputmode="numeric" value="${r.n}" aria-label="Numărul de grile">
            <span class="sav"></span>${b.sep?`<span></span>`:`<button class="xb" aria-label="Scoate materia din bloc" title="Scoate materia din bloc">×</button>`}
            <div class="swarn hidden"></div></div>`).join("")||`<div class="simnote" style="margin:4px 0">Blocul e gol. Adaugă o materie.</div>`}</div>
        <div class="sbf">${b.sep?"":`<button class="btn sec2 sm addr" ${subs.length?"":"disabled"}>+ Materie în bloc</button>
          <span class="split"><input class="num tot" type="number" min="0" inputmode="numeric" placeholder="Total" aria-label="Totalul de împărțit egal"><button class="btn sec2 sm spl" title="Împarte totalul egal între materiile blocului">Împarte</button></span>`}
          <span class="sbtot"></span></div></div>`).join("")}</div>
      ${S.blocks.length?"":`<div class="empty" style="padding:16px">${subs.length?"Niciun bloc. Adaugă un bloc sau o materie separată.":"Alege întâi materialul (pasul 02). Simularea folosește doar grilele."}</div>`}

      <div class="tpls">${tpls.map(t=>{const nb=(t.sim.blocks||[]).length,ng=(t.sim.blocks||[]).reduce((a,b)=>a+b.rows.reduce((x,r)=>x+(+r.n||0),0),0);

    /* blocuri și rânduri */

      $$(".sr",el).forEach((re,ri)=>{const r=b.rows[ri];

        sp.onclick=go;ti.onkeydown=e=>{if(e.key==="Enter")go()}}});
