/* ============================ încărcarea pachetelor ============================ */
function loadPack(id){
  if(TRV.packs[id]) return Promise.resolve(TRV.packs[id]);
  const u=IDX().find(x=>x.id===id);
  return new Promise((res,rej)=>{const s=document.createElement("script");s.src="pachete/"+u.file;s.onload=()=>res(TRV.packs[id]);s.onerror=()=>rej(new Error("Nu pot încărca "+u.file));document.head.append(s)})}
async function buildDeck(meta){
  const ids=[...new Set(meta.map(m=>m.unit))];
  for(const id of ids) await loadPack(id);
  const byId={};
  for(const id of ids){const p=TRV.packs[id];const u=IDX().find(x=>x.id===id);
    for(const q of p.questions){ q._unit=id; q._subject=u.subject; q._unitLabel=u.unit; q._topic=u.topics[q.topic]||""; q._img=q.img?(p.imgs[q.img]||q.img):null; byId[q.id]=q}}
  return meta.map(m=>byId[m.id]).filter(Boolean)}

/* fabrica de întrebări: amestecă, preferă greșelile și temele frecvente, nu repetă până nu epuizează */
function Dealer(qs,filter){
  let bag=[];const used=new Set();
  const refill=()=>{let pool=qs.filter(q=>filter?filter(q):true);
    const w=[];for(const q of pool){w.push(q);if(q.hot)w.push(q);if(Mem.isWrong(q.id))w.push(q)}
    bag=shuffle(w)};
  return {next(avoid){ if(!bag.length)refill(); for(let tries=0;tries<2;tries++){
      let i=bag.findIndex(q=>!used.has(q.id)&&q!==avoid);
      if(i<0){used.clear();refill();continue}
      const q=bag.splice(i,1)[0];used.add(q.id);return q} return bag.pop()||qs[0]}}}

/* ============================ foaia de întrebare (comună tuturor modurilor) ============================ */
let SHEET=null;
function openSheet(){closeSheet();SHEET=h(`<div class="sheet" role="dialog" aria-modal="true"><div class="card"></div></div>`);$("#layer").append(SHEET);document.body.classList.add("sheet-open");Amb.sync();return $(".card",SHEET)}
function closeSheet(){if(SHEET){const s=SHEET;SHEET=null;
    if(reduced())s.remove();else{s.classList.add("out");$$("[id]",s).forEach(e=>e.removeAttribute("id"));setTimeout(()=>s.remove(),170)}}
  document.body.classList.remove("sheet-open");Amb.sync()}
function lightbox(src){const l=h(`<div class="lightbox"><img alt=""></div>`);$("img",l).src=src;l.onclick=()=>l.remove();document.body.append(l)}

function headHTML(q,player,extra=""){
  const S=SUBJ[q._subject]||{name:q._subject};
  return `<div class="qhead"><span class="who" style="color:${player.color}"><span class="dot"></span>${esc(player.name)}</span>
    <span class="pill">${esc(S.name)} · ${esc(q._unitLabel)}</span>${q._topic?`<span class="pill">${esc(q._topic)}</span>`:""}
    <span class="pill">${DIFF[q.diff]||""}</span>${q.hot?`<span class="pill hot">apare des</span>`:""}${extra}</div>`}

/* grile: complement simplu (CS: 4 variante, 1 corectă) sau complement multiplu (CM: 5 variante, 2–5 corecte)
   CS: 10 dacă alegi varianta corectă, altfel 0. CM (Full Match): 2 puncte pentru fiecare variantă corectă bifată
   și pentru fiecare variantă greșită nebifată, maximum 10; o singură variantă bifată = 0. */
const isCS=q=>q.opts.length===4&&q.ok.length===1;
function gradeMCQ(q,sel){const S=sel instanceof Set?sel:new Set(sel);
  if(q.lp){let sc=0;q.opts.forEach((_,i)=>{if(q.ok.includes(i)===S.has(i))sc+=2});return sc}
  if(isCS(q))return S.size===1&&S.has(q.ok[0])?10:0;
  if(S.size<=1)return 0;
  let sc=0;q.opts.forEach((_,i)=>{if(q.ok.includes(i)===S.has(i))sc+=2});return Math.min(10,sc)}
const kindHTML=q=>q.lp?`<div class="qkind"><i></i>Grilă ca la examenul de LP · una sau mai multe corecte</div>`:isCS(q)?`<div class="qkind cs"><i></i>Complement simplu · un singur răspuns</div>`:`<div class="qkind"><i></i>Complement multiplu · 2–5 răspunsuri</div>`;

/* întoarce {pass, pct, score}
   opțiuni: time (s), hint, onHint, gradeNow,
            head   = HTML suplimentar în antet,
            onPhase(p) = "answer" când jucătorul citește/răspunde, "grade" când începe corectarea,
            ctl    = obiect în care se pune ctl.abort() (oprește întrebarea fără s-o înregistreze) */
function askQuestion(q,player,examiner,o={}){
  return new Promise(resolve=>{
    const card=openSheet();
    const timeLimit=o.time??0;
    let timerIv=null,tLeft=timeLimit,settled=false;
    const stopTimer=()=>{clearInterval(timerIv);timerIv=null};
    const phase=p=>{try{o.onPhase&&o.onPhase(p)}catch(e){}};
    const startTimer=(el,onEnd)=>{if(!timeLimit)return;tLeft=timeLimit;el.textContent=fmt(tLeft);
      timerIv=setInterval(()=>{tLeft--;el.textContent=fmt(tLeft);el.classList.toggle("low",tLeft<=10);if(tLeft<=10&&tLeft>0)Snd.tick();if(tLeft<=0){stopTimer();Snd.alarm();onEnd&&onEnd()}},1000)};
    const imgHTML=q._img?`<div class="qimg"><img alt="Imaginea întrebării"><span class="zoom">Atinge pentru mărire</span></div>`:"";
    const done=(res)=>{if(settled)return;settled=true;stopTimer();Mem.record(q,player.name,res.pass);resolve(res)};
    if(o.ctl)o.ctl.abort=()=>{if(settled)return;settled=true;stopTimer();card.dataset.done=1;resolve({pass:false,pct:0,score:0,aborted:true})};
    const extra=(timeLimit?`<span class="timer" id="tm">--</span>`:"")+(o.head||"");

    if(q.type==="mcq"){
      const sel=new Set(),cs=isCS(q);
      card.innerHTML=headHTML(q,player,extra)+
        `<div class="qtext">${md(q.q)}</div>${imgHTML}${kindHTML(q)}<div class="opts"></div>
        <div class="actions"><span class="grow">${q.lp?"Bifează toate variantele adevărate: pot fi una sau mai multe.":cs?"Alegi o singură variantă.":"Bifează 2–5 variante. O singură variantă bifată = 0 puncte."}</span>${o.hint?`<button class="btn sec2 sm" id="hint">${TOOLS[0].svg.replace('<svg','<svg width="18" height="18"')} Stetoscop</button>`:""}<button class="btn pri" id="ok">Confirmă</button></div>`;
      if(q._img){$(".qimg img",card).src=q._img;$(".qimg",card).onclick=()=>lightbox(q._img)}
      const box=$(".opts",card);
      const paint=()=>[...box.children].forEach((b,i)=>b.setAttribute("aria-pressed",sel.has(i)));
      q.opts.forEach((t,i)=>{const b=h(`<button class="opt" aria-pressed="false" style="--i:${i}"><span class="k">${"ABCDE"[i]}</span><span>${md(t)}</span></button>`);
        b.onclick=()=>{if(card.dataset.done)return;Snd.click();
          if(cs){const had=sel.has(i);sel.clear();if(!had)sel.add(i)}else sel.has(i)?sel.delete(i):sel.add(i);paint()};box.append(b)});
      const hint=$("#hint",card);
      if(hint) hint.onclick=()=>{const c=q.ok.find(i=>!sel.has(i));
        if(c!=null){if(cs)sel.clear();sel.add(c);paint();box.children[c].querySelector(".k").textContent="✓"}
        hint.remove();o.onHint&&o.onHint();Snd.power()};
      const finish=()=>{if(card.dataset.done)return;card.dataset.done=1;stopTimer();phase("grade");
        const n=sel.size,score=gradeMCQ(q,sel);
        q.opts.forEach((_,i)=>{const c=q.ok.includes(i),s=sel.has(i);
          const el=box.children[i];el.classList.add(c&&s?"r-ok":c?"r-miss":s?"r-bad":"r-fine");
          el.insertAdjacentHTML("beforeend",`<span class="res">${c&&s?(cs?"corect ales":"corect bifat"):c?(cs?"răspunsul corect":"trebuia bifat"):s?(cs?"greșit ales":"greșit bifat"):""}</span>`)});
        const pct=score*10,pass=score>=7.5;
        (pass?Snd.ok:Snd.bad).call(Snd);
        $(".actions",card).remove();
        const note=q.lp?(n?"":"Nicio variantă bifată. "):cs?(n?"":"Nicio variantă aleasă. "):(n===1?"O singură variantă bifată la complement multiplu dă 0. ":n===0?"Nicio variantă bifată. ":"");
        card.insertAdjacentHTML("beforeend",`<div class="verdict ${pass?"ok":"no"}"><span><span class="vs" data-to="${score}">0</span>/10 · ${pass?"trece":"nu trece"}</span><small>${note}${q.lp?"2 puncte pe fiecare variantă judecată corect · pragul: 75% (minimum 8/10)":cs?"Complement simplu: 10 sau 0 puncte":"Full Match · pragul: 75% (minimum 8/10)"}</small></div>
          ${q.why?`<div class="why">${md(q.why)}</div>`:""}${q.src?`<div class="src">Sursa: ${esc(q.src)}</div>`:""}
          <div class="actions"><button class="btn pri" id="next">Continuă</button></div>`);
        animateScores($(".verdict",card));
        $("#next",card).onclick=()=>{done({pass,pct,score})}};
      $("#ok",card).onclick=finish;
      phase("answer");
      if(timeLimit) startTimer($("#tm",card),finish);
      return}

    if(q.type==="calc"||q.type==="graph"){ return askCalc(q,player,o,card,extra,imgHTML,done,stopTimer,startTimer,phase) }

    /* întrebare deschisă: răspuns oral, apoi bifează adversarul */
    card.innerHTML=headHTML(q,player,extra)+
      `<div class="qtext">${md(q.q)}</div>${imgHTML}
      <div class="speak">${ICON.mic}<span><b style="color:var(--bone)">${esc(player.name)}</b> răspunde cu voce tare. Contează doar ce spune. ${esc(examiner.name)} ascultă, apoi bifează ce s-a spus.</span></div>
      <div class="actions">${o.hint?`<button class="btn sec2 sm" id="hint">Stetoscop · indiciu</button>`:""}<button class="btn pri" id="ok">Am terminat de vorbit</button></div>`;
    if(q._img){$(".qimg img",card).src=q._img;$(".qimg",card).onclick=()=>lightbox(q._img)}
    const hint=$("#hint",card);
    if(hint) hint.onclick=()=>{const k=q.kp[0];hint.replaceWith(h(`<div class="why" style="margin:0;flex:1">Indiciu: începe cu <b>${md(k.s||"")}</b> – ${md(k.t.split(/[,;:(]/)[0])}…</div>`));o.onHint&&o.onHint();Snd.power()};
    const grade=()=>{if(settled)return;stopTimer();phase("grade");Snd.click();
      const stages=[];q.kp.forEach((k,i)=>{const s=k.s||"";let g=stages.find(x=>x.s===s);if(!g)stages.push(g={s,items:[]});g.items.push({...k,i})});
      card.innerHTML=headHTML(q,player,o.head||"")+`<div class="qtext" style="font-size:16px">${md(q.q)}</div>
        <div style="color:var(--dim);font-size:14px"><b style="color:${examiner.color}">${esc(examiner.name)}</b>, bifează ideile pe care ${esc(player.name)} le-a spus (măcar în esență):</div>
        <div class="kp">${stages.map(g=>`${g.s?`<div class="stage">${esc(g.s)}</div>`:""}${g.items.map(k=>`<label><input type="checkbox" data-i="${k.i}"><span>${md(k.t)}</span></label>`).join("")}`).join("")}</div>
        <div class="meter"><i></i><b></b></div><div class="meterlab"><span id="pc">0%</span><span>prag 75%</span></div>
        ${q.model?`<details class="model"><summary>Răspunsul-model</summary><div>${md(q.model)}</div></details>`:""}${q.src?`<div class="src">Sursa: ${esc(q.src)}</div>`:""}
        <div class="actions"><button class="btn pri" id="ok">Confirmă punctajul</button></div>`;
      if(card.parentElement)card.scrollTop=0;
      const upd=()=>{const n=$$(".kp input:checked",card).length,pct=Math.round(n/q.kp.length*100);$("#pc",card).textContent=pct+"% · "+n+" din "+q.kp.length;
        const bar=$(".meter i",card);bar.style.width=pct+"%";bar.classList.toggle("pass",pct>=75)};
      $$(".kp input",card).forEach(c=>c.onchange=()=>{Snd.tone(c.checked?1320:880,.06,"sine",.03,0,c.checked?1560:740);upd()});upd();
      $("#ok",card).onclick=()=>{const n=$$(".kp input:checked",card).length,pct=Math.round(n/q.kp.length*100),pass=pct>=75;
        (pass?Snd.ok:Snd.bad).call(Snd);
        $(".actions",card).outerHTML=`<div class="verdict ${pass?"ok":"no"}"><span><span class="vs" data-to="${pct}">0</span>% · ${pass?"trece":"nu trece"}</span><small>Pragul: 75% din ideile-cheie</small></div><div class="actions"><button class="btn pri" id="next">Continuă</button></div>`;
        animateScores($(".verdict",card));
        $$(".kp input",card).forEach(c=>c.disabled=true);
        $("#next",card).onclick=()=>done({pass,pct,score:pct/10})}};
    $("#ok",card).onclick=grade;
    if(o.gradeNow) return grade();
    phase("answer");
    if(timeLimit) startTimer($("#tm",card),()=>{toast("Timpul a expirat");grade()});
  })}


/* ---------- calcul (răspuns numeric / ↓ N ↑) și grafic de etalonare pe hârtie milimetrică ----------
   calc : f = [{l, u, a, tol} | {l, o:[...], a:index}], sol, src
   graph: + xl, yl, xu, yu, xcm, ycm (valoarea unui cm), wcm, hcm, pts:[[x,y]...], probe (semnalul probei)
          f[0] = concentrația citită (se completează din atingerea pe grafic); punctele = 40% din notă */
const numParse=v=>{v=String(v??"").trim().replace(/\s/g,"").replace("−","-").replace(",",".");return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(v)?parseFloat(v):NaN};
const numOK=(v,f)=>{if(!isFinite(v))return false;const tol=f.tol!=null?f.tol:Math.max(Math.abs(f.a)*0.02,1e-9);return Math.abs(v-f.a)<=tol+1e-9};
const fmtN=x=>String(+(+x).toPrecision(6)).replace(".",",");
const solHTML=s=>s?`<div class="sol"><b class="t">Rezolvarea</b>${String(s).split("\n").map(md).join("<br>")}</div>`:"";
function fieldsHTML(q){return `<div class="calc">${q.f.map((f,i)=>f.o
  ?`<div class="cf" data-i="${i}"><span class="cl">${md(f.l)}</span><span class="seg">${f.o.map((t,j)=>`<button class="sg" type="button" aria-pressed="false" data-j="${j}">${esc(t)}</button>`).join("")}</span></div>`
  :`<label class="cf" data-i="${i}"><span class="cl">${md(f.l)}</span><span class="ci"><input inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="?"><span class="cu">${esc(f.u||"")}</span></span></label>`).join("")}</div>`}
function askCalc(q,player,o,card,extra,imgHTML,done,stopTimer,startTimer,phase){
  const G2=q.type==="graph";
  const std=G2?`<table class="stdt"><tr><th>${md(q.xl)}</th>${q.pts.map(p=>`<td>${fmtN(p[0])}</td>`).join("")}</tr><tr><th>${md(q.yl)}</th>${q.pts.map(p=>`<td>${fmtN(p[1])}</td>`).join("")}</tr></table>`:"";
  card.innerHTML=headHTML(q,player,extra)+`<div class="qtext">${md(q.q)}</div>${imgHTML}
    <div class="qkind"><i></i>${G2?"Grafic pe hârtie milimetrică · puncte, curbă, citire":q.f.every(f=>f.o)?"Completezi: ↓ scade · N normal · ↑ crește":"Calcul · scrii rezultatul cu unitatea"}</div>${std}
    ${G2?`<div class="mmwrap"></div><div class="gstep" id="gs"></div>`:""}<div id="fw" ${G2?'style="display:none;margin-top:12px"':""}>${fieldsHTML(q)}</div>
    <div class="actions"><span class="grow">${G2?"Atinge hârtia ca să pui fiecare punct. Zecimalele cu virgulă.":"Zecimalele cu virgulă sau punct."}</span>${G2?`<button class="btn sec2 sm" id="undo">Anulează ultimul</button>`:""}<button class="btn pri" id="ok">${G2?"Verifică punctele":"Verifică"}</button></div>`;
  if(q._img){$(".qimg img",card).src=q._img;$(".qimg",card).onclick=()=>lightbox(q._img)}
  $$(".cf .seg",card).forEach(sg=>sg.onclick=e=>{const b=e.target.closest(".sg");if(!b||card.dataset.done)return;Snd.click();$$(".sg",sg).forEach(x=>x.setAttribute("aria-pressed",x===b))});
  let gr=null,ptScore=1;
  const gradeFields=()=>{if(card.dataset.done)return;card.dataset.done=1;stopTimer();phase("grade");
    let ok=0;q.f.forEach((f,i)=>{const row=$(`.cf[data-i="${i}"]`,card);let good,shown;
      if(f.o){const b=$(".sg[aria-pressed=true]",row);const j=b?+b.dataset.j:-1;good=j===f.a;shown=f.o[f.a];$$(".sg",row).forEach(x=>x.disabled=true)}
      else{const inp=$("input",row);const v=numParse(inp.value);good=numOK(v,f);shown=fmtN(f.a)+(f.u?" "+f.u:"");inp.disabled=true}
      if(good)ok++;row.classList.add(good?"r-ok":"r-bad");row.insertAdjacentHTML("beforeend",`<span class="res">${good?"corect":"corect: "+esc(shown)}</span>`)});
    const fw=ok/q.f.length,score=Math.round((G2?(.4*ptScore+.6*fw):fw)*100)/10,pct=Math.round(score*10),pass=pct>=75;
    (pass?Snd.ok:Snd.bad).call(Snd);$(".actions",card).remove();
    card.insertAdjacentHTML("beforeend",`<div class="verdict ${pass?"ok":"no"}"><span><span class="vs" data-to="${score}" data-dec="1">0</span>/10 · ${pass?"trece":"nu trece"}</span><small>${G2?`Punctele ${Math.round(ptScore*100)}% (40% din notă) · rezultatele ${ok} din ${q.f.length} (60%)`:`${ok} din ${q.f.length} rezultate corecte`} · pragul 75%</small></div>
      ${solHTML(q.sol)}${q.src?`<div class="src">Sursa: ${esc(q.src)}</div>`:""}<div class="actions"><button class="btn pri" id="next">Continuă</button></div>`);
    animateScores($(".verdict",card));if(gr)gr.lock();
    $("#next",card).onclick=()=>done({pass,pct,score})};
  if(!G2){$("#ok",card).onclick=gradeFields;
    $$(".cf input",card).forEach(i=>i.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();gradeFields()}});
    phase("answer");if(o.time)startTimer($("#tm",card),gradeFields);return}
  /* ---- grafic ---- */
  gr=mmGraph($(".mmwrap",card),q);
  const gs=$("#gs",card),okB=$("#ok",card),undo=$("#undo",card);
  const say=()=>{const n=gr.user.length;if(n<q.pts.length){const p=q.pts[n];gs.innerHTML=`Pasul 1 · pune <b>punctul ${n+1} din ${q.pts.length}</b>: ${esc(fmtN(p[0]))} ${esc(q.xu)} → ${esc(fmtN(p[1]))} ${esc(q.yu)}`}else gs.innerHTML=`Toate punctele sunt puse. Apasă <b>Verifică punctele</b>.`};
  gr.onTap=()=>{Snd.click();say()};say();
  undo.onclick=()=>{gr.undo();say()};
  okB.onclick=()=>{if(gr.stage===0){if(gr.user.length<q.pts.length){toast("Mai ai de pus "+(q.pts.length-gr.user.length)+" puncte");return}
      ptScore=gr.check();undo.remove();Snd.power();
      gs.innerHTML=`Pasul 2 · Punctele: <b>${Math.round(ptScore*100)}% corecte</b>${ptScore<1?" (cele roșii arată unde trebuiau)":""}. Curba e trasă. Proba dă <b>${esc(fmtN(q.probe))} ${esc(q.yu)}</b>: atinge curba la acest semnal, apoi cobori pe X și completezi.`;
      $("#fw",card).style.display="";okB.textContent="Verifică";
      gr.onRead=x=>{const inp=$('.cf[data-i="0"] input',card);if(inp&&!card.dataset.done)inp.value=fmtN(Math.round(x*1000)/1000)};return}
    gradeFields()};
  phase("answer");if(o.time)startTimer($("#tm",card),()=>{if(gr.stage===0){ptScore=gr.user.length?gr.check():0;$("#fw",card).style.display=""}gradeFields()});
}
function mmGraph(host,q){
  const NS="http://www.w3.org/2000/svg",W=q.wcm*10,H=q.hcm*10,L=15,T=6,R=6,B=13;
  const X=v=>L+v/q.xcm*10, Y=v=>T+H-v/q.ycm*10, VX=px=>(px-L)/10*q.xcm, VY=py=>(T+H-py)/10*q.ycm;
  let g=`<svg viewBox="0 0 ${L+W+R} ${T+H+B}" xmlns="${NS}" font-family="Inter,sans-serif">`;
  for(let i=0;i<=W;i++){const w=i%10?(i%5?.08:.16):.3,c=i%10?"#f0c39a":"#dd8a4a";g+=`<line x1="${L+i}" y1="${T}" x2="${L+i}" y2="${T+H}" stroke="${c}" stroke-width="${w}"/>`}
  for(let j=0;j<=H;j++){const w=j%10?(j%5?.08:.16):.3,c=j%10?"#f0c39a":"#dd8a4a";g+=`<line x1="${L}" y1="${T+H-j}" x2="${L+W}" y2="${T+H-j}" stroke="${c}" stroke-width="${w}"/>`}
  g+=`<line x1="${L}" y1="${T+H}" x2="${L+W}" y2="${T+H}" stroke="#17181c" stroke-width=".6"/><line x1="${L}" y1="${T}" x2="${L}" y2="${T+H}" stroke="#17181c" stroke-width=".6"/>`;
  for(let k=0;k<=q.wcm;k++)g+=`<text x="${L+k*10}" y="${T+H+4.6}" font-size="3.4" text-anchor="middle" fill="#17181c" font-weight="600">${fmtN(k*q.xcm)}</text>`;
  for(let k=1;k<=q.hcm;k++)g+=`<text x="${L-1.4}" y="${T+H-k*10+1}" font-size="3.4" text-anchor="end" fill="#17181c" font-weight="600">${fmtN(k*q.ycm)}</text>`;
  g+=`<text x="${L+W/2}" y="${T+H+10}" font-size="3.3" text-anchor="middle" fill="#44464f" font-weight="700">${esc(q.xl)}</text>`;
  g+=`<text x="4" y="${T+H/2}" font-size="3.3" text-anchor="middle" fill="#44464f" font-weight="700" transform="rotate(-90 4 ${T+H/2})">${esc(q.yl)}</text>`;
  g+=`<g class="lay"></g></svg>`;host.innerHTML=g;
  const svgE=$("svg",host),lay=$(".lay",host);
  const st={user:[],stage:0,onTap:null,onRead:null,locked:false};
  const snap=v=>Math.round(v*2)/2;
  const pt=e=>{const P=svgE.createSVGPoint();P.x=e.clientX;P.y=e.clientY;const m=svgE.getScreenCTM();if(!m)return null;const r=P.matrixTransform(m.inverse());return{x:snap(Math.min(L+W,Math.max(L,r.x))),y:snap(Math.min(T+H,Math.max(T,r.y)))}};
  const draw=()=>{let s="";
    if(st.stage>=1){s+=`<polyline points="${q.pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")}" fill="none" stroke="#1f5fd1" stroke-width=".8"/>`;
      q.pts.forEach(p=>s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="1.3" fill="#1f5fd1"/>`)}
    st.user.forEach((u,i)=>{const bad=st.stage>=1&&!st.okv[i];
      s+=`<g stroke="${bad?"#c8453b":"#17181c"}" stroke-width=".55"><line x1="${u.x-1.6}" y1="${u.y-1.6}" x2="${u.x+1.6}" y2="${u.y+1.6}"/><line x1="${u.x-1.6}" y1="${u.y+1.6}" x2="${u.x+1.6}" y2="${u.y-1.6}"/></g>`;
      if(bad)s+=`<line x1="${u.x}" y1="${u.y}" x2="${X(q.pts[i][0])}" y2="${Y(q.pts[i][1])}" stroke="#c8453b" stroke-width=".35" stroke-dasharray="1 .8"/>`});
    if(st.read!=null){const px=st.read.x,py=Y(q.probe);
      s+=`<line x1="${L}" y1="${py}" x2="${px}" y2="${py}" stroke="#c8453b" stroke-width=".6" stroke-dasharray="1.6 1"/><line x1="${px}" y1="${py}" x2="${px}" y2="${T+H}" stroke="#c8453b" stroke-width=".6" stroke-dasharray="1.6 1"/><circle cx="${px}" cy="${py}" r="1.4" fill="#c8453b"/>`}
    lay.innerHTML=s};
  svgE.addEventListener("pointerdown",e=>{if(st.locked)return;const p=pt(e);if(!p)return;e.preventDefault();
    if(st.stage===0){if(st.user.length<q.pts.length){st.user.push(p);draw();st.onTap&&st.onTap()}}
    else if(st.stage===1){st.read={x:p.x};draw();st.onRead&&st.onRead(VX(p.x))}});
  st.undo=()=>{if(st.stage===0&&st.user.length){st.user.pop();draw()}};
  st.check=()=>{st.okv=st.user.map((u,i)=>Math.abs(u.x-X(q.pts[i][0]))<=2&&Math.abs(u.y-Y(q.pts[i][1]))<=2);st.stage=1;draw();
    return q.pts.length?st.okv.filter(Boolean).length/q.pts.length:1};
  st.lock=()=>{st.locked=true};
  return st}

/* ---------------------------- Triviador ---------------------------- */
const Triv={
  start(){
    G.own={};ORG.forEach(o=>G.own[o.id]=null);
    G.base=["creier","os"];G.own.creier=0;G.own.os=1;
    G.shield={};G.round=1;G.turn=0;G.maxRounds=Setup.rounds;G.armed=null;G.extra=false;
    this.calc();this.render()},
  calc(){G.players.forEach((p,i)=>{p.score=ORG.reduce((s,o)=>s+(G.own[o.id]===i?(G.base[i]===o.id?5:o.v):0),0)})},
  targets(i){const mine=ORG.filter(o=>G.own[o.id]===i).map(o=>o.id);
    let t=new Set();
    if(G.armed==="bist") ORG.forEach(o=>{if(G.own[o.id]!==i)t.add(o.id)});
    else mine.forEach(m=>ADJ[m].forEach(a=>{if(G.own[a]!==i)t.add(a)}));
    for(const id of [...t]) if(G.shield[id]&&G.shield[id].until>=G.round&&G.own[id]!==i&&G.own[id]!==null) t.delete(id);
    return t},
  render(){
    const first=!G.rendered;G.rendered=true;
    const P=G.players[G.turn];
    const g=h(`<div class="game"><div class="panel mapwrap">${bodySVG(false)}</div><div class="side">
      ${scorePlates()}
      <div class="turn" style="--c:${P.color}"><div class="big">${esc(P.name)} e la mutare</div><div class="hint" id="thint"></div>
      <div class="rd">Runda ${Math.min(G.round,G.maxRounds)} din ${G.maxRounds}</div></div>
      <div><div class="lbl2" style="margin-top:0">Instrumentele lui ${esc(P.name)} · fiecare o dată pe joc</div><div class="tray"></div></div>
      <div class="log" aria-live="polite"></div></div></div>`);
    /* hartă */
    ORG.forEach(o=>{const el=$("#o-"+o.id,g);const ow=G.own[o.id];if(ow!==null)el.classList.add(G.players[ow].cls);
      if(G.shield[o.id]&&G.shield[o.id].until>=G.round)el.classList.add("shield");
      const isBase=G.base.includes(o.id);
      const bx=o.lx+(o.n.length*2.9)+8;
      $(".badge",el).innerHTML=`<circle class="valbg" cx="${bx}" cy="${o.ly}" r="7"/><text class="val" x="${bx}" y="${o.ly+3.3}" text-anchor="middle">${isBase?"B":o.v}</text>`});
    const T=this.targets(G.turn);
    ORG.forEach(o=>{const el=$("#o-"+o.id,g);
      if(T.has(o.id)){el.classList.add("target");el.onclick=el.onkeydown=(e)=>{if(e.type==="keydown"&&e.key!=="Enter"&&e.key!==" ")return;e.preventDefault&&e.preventDefault();this.attack(o.id)}}
      else el.classList.add("dimmed")});
    /* instrumente */
    const tray=$(".tray",g);
    TOOLS.forEach(t=>{const has=P.tools[t.id]>0;
      const usableNow=["garou","bist","adren"].includes(t.id);
      const b=h(`<button class="tool" style="--c:${t.c}" aria-pressed="${G.armed===t.id}" ${has&&usableNow?"":"disabled"} title="${t.name}: ${t.what}">${t.svg}<b>${t.name}</b>${t.what}</button>`);
      if(has&&!usableNow) b.title+=" · se folosește în timpul întrebării";
      b.onclick=()=>this.useTool(t.id);tray.append(b)});
    $("#thint",g).textContent=G.armed==="bist"?"Bisturiu activ: poți ataca orice organ, oricât de departe.":G.armed==="garou"?"Garou activ: atinge un organ al tău ca să-l protejezi 2 runde.":"Alege un organ marcat: liber (îl cucerești) sau al adversarului (atac).";
    if(G.armed==="garou") ORG.forEach(o=>{const el=$("#o-"+o.id,g);if(G.own[o.id]===G.turn){el.classList.remove("dimmed");el.classList.add("target");el.onclick=()=>{G.shield[o.id]={until:G.round+2,by:G.turn};P.tools.garou=0;G.armed=null;Snd.power();this.log(`${P.name} pune garou pe ${o.n}`);G.fx={id:o.id,kind:"def"};this.render()}}else{el.classList.add("dimmed");el.classList.remove("target");el.onclick=null}});
    const lg=$(".log",g);lg.innerHTML=G.log.slice(-40).reverse().map(x=>`<div>${x}</div>`).join("")||"<div>Primul organ al fiecăruia e baza: Creier și Os. Baza valorează 5 puncte și are 3 vieți.</div>";
    mount(g,first);animateScores(g);
    if(G.fx){const f=G.fx;G.fx=null;mapFX($("svg.body",g),f.id,f.kind,f.color)}
    turnBanner(P,`Rândul lui ${P.name} · runda ${Math.min(G.round,G.maxRounds)}`);
    if(!T.size&&G.armed!=="garou"){setTimeout(()=>{toast("Nu ai unde muta: tura trece");this.nextTurn()},600)}
  },
  log(t){G.log.push(t.replace(/^(\S+)/,"<b>$1</b>"))},
  useTool(id){const P=G.players[G.turn];Snd.click();
    if(id==="adren"){P.tools.adren=0;G.extra=true;Snd.power();this.log(`${P.name} ia adrenalină: mai mută o dată tura asta`);return this.render()}
    G.armed=G.armed===id?null:id;this.render()},
  async attack(id){
    if(G.busy)return;G.busy=true;
    const g0=G;try{await this._attack(id)}finally{g0.busy=false}},
  async _attack(id){
    const g0=G,i=G.turn,P=G.players[i],D=other(P),o=ORG.find(x=>x.id===id),enemy=G.own[id]!==null;
    if(G.armed==="bist"){P.tools.bist=0;this.log(`${P.name} folosește bisturiul spre ${o.n}`)}
    G.armed=null;Snd.click();
    /* țintirea: un reticul în culoarea jucătorului se strânge pe organ */
    if(!reduced()){mapFX($("#app svg.body"),id,"aim",enemy?"#FF6B6B":P.color);await sleep(enemy?560:420)}
    const ask=async(pl,ex)=>{const q=G.dealer.next();
      let r=await askQuestion(q,pl,ex,{time:q.type==="open"?Setup.tAns:0,hint:pl.tools.steto>0,onHint:()=>{pl.tools.steto=0}});
      pl.n++;if(r.pass)pl.ok++;
      if(!r.pass&&pl.tools.defib>0){closeSheet();
        const again=await this.confirmDefib(pl);
        if(again){pl.tools.defib=0;Snd.power();this.log(`${pl.name} folosește defibrilatorul`);const q2=G.dealer.next(q);
          r=await askQuestion(q2,pl,ex,{time:q2.type==="open"?Setup.tAns:0});pl.n++;if(r.pass)pl.ok++}}
      closeSheet();return r};
    const r=await ask(P,D);
    if(!alive(g0))return;
    if(!r.pass){this.log(`${P.name} ratează ${o.n}`);return this.after()}
    if(!enemy){G.own[id]=i;this.log(`${P.name} cucerește ${o.n} (+${o.v})`);G.fx={id,kind:"conq",color:P.color};return this.after()}
    /* atac pe organ inamic: apărătorul răspunde și el */
    toast(`${D.name} apără ${o.n}`);await sleep(500);if(!alive(g0))return;
    const rd=await ask(D,P);
    if(!alive(g0))return;
    if(rd.pass){this.log(`${D.name} apără ${o.n}`);G.fx={id,kind:"def"};return this.after()}
    if(G.base[1-i]===id){D.hp--;this.log(`${P.name} lovește baza lui ${D.name} (${D.hp} vieți)`);G.fx={id,kind:"base"};Snd.hurt();FX.flash("#FF6B6B");
      if(D.hp<=0){G.own[id]=i;this.calc();return this.finish(P,`${P.name} a cucerit baza adversarului.`)}}
    else{G.own[id]=i;this.log(`${P.name} îi ia lui ${D.name} ${o.n}`);G.fx={id,kind:"conq",color:P.color}}
    this.after()},
  confirmDefib(pl){return new Promise(res=>{const c=openSheet();
    c.innerHTML=`<div class="qhead"><span class="who" style="color:${pl.color}"><span class="dot"></span>${esc(pl.name)}</span></div>
      <h2 class="st">Răspuns greșit. Folosești defibrilatorul?</h2><p style="color:var(--dim)">Primești o întrebare nouă pentru același organ. Se poate folosi o singură dată pe joc.</p>
      <div class="actions"><button class="btn sec2" id="no">Nu, mai departe</button><button class="btn amb" id="yes">Da, a doua șansă</button></div>`;
    $("#no",c).onclick=()=>{closeSheet();res(false)};$("#yes",c).onclick=()=>{closeSheet();res(true)}})},
  after(){this.calc();
    if(G.extra){G.extra=false;return this.render()}
    this.nextTurn()},
  nextTurn(){G.turn=1-G.turn;if(G.turn===0)G.round++;
    if(G.round>G.maxRounds){const [a,b]=G.players;const w=a.score===b.score?(a.ok===b.ok?null:a.ok>b.ok?a:b):a.score>b.score?a:b;
      return this.finish(w,`${G.maxRounds} runde jucate.`)}
    this.render()},
  finish(w,why){this.calc();endMatch(w?`${w.name} câștigă`:"Egalitate",esc(why)+" Scorul = valoarea organelor deținute (baza 5).",w)}
};

/* ---------------------------- Circuit OSPE ---------------------------- */
const Circuit={
  start(){G.turn=0;G.st=0;G.total=Setup.stations*2;
    const T=Setup.timing==="real"?{read:60,ans:360,last:60}:{read:30,ans:180,last:30};G.T=T;

    this.intro()},
  intro(){
    const sc=h(`<div class="screen narrow"><div class="panel station"><div class="eyebrow">Mod examen</div><h1 style="font-size:clamp(26px,4vw,38px);margin-top:10px">Circuit OSPE</h1>

      <div>Se punctează doar ce spui cu voce tare. Examinatorul nu pune întrebări și anunță doar ultimul minut.</div>
      <div>După stație, examinatorul bifează ideile-cheie în ordinea punctajului. Stația e promovată la 75%.</div>

  async station(){
    const g0=G;if(!alive(g0))return;

    const P=G.players[G.turn],E=other(P);const q=G.dealerS.next();

      <div class="panel station" style="margin-top:14px"><div class="phase">Stația ${G.st+1} din ${G.total} · răspunde <span style="color:${P.color}">${esc(P.name)}</span>, examinează <span style="color:${E.color}">${esc(E.name)}</span></div>
      <div class="eyebrow" id="ph" style="margin-top:16px;color:var(--teal)">Citirea sarcinii</div><div class="clock" id="ck">${fmt(G.T.read)}</div><div class="ring"><i style="width:100%"></i></div>

    mount(sc,true);animateScores(sc);
    turnBanner(P,`Stația ${G.st+1}: răspunde ${P.name}`);

    const ck=$("#ck",sc),bar=$(".ring i",sc),ph=$("#ph",sc);
    const run=(secs,onTick)=>new Promise(res=>{let t=secs;const iv=setInterval(()=>{if(!alive(g0)){clearInterval(iv);return}t--;ck.textContent=fmt(t);bar.style.width=(t/secs*100)+"%";onTick&&onTick(t);if(t<=0){clearInterval(iv);res()}},1000);
      $("#skip",sc).onclick=()=>{clearInterval(iv);Snd.click();res()}});
    await run(G.T.read);if(!alive(g0))return;
    Snd.bell(880,.06,0,.6);ph.textContent="Răspuns oral";ck.textContent=fmt(G.T.ans);bar.style.width="100%";
    $("#skip",sc).textContent="Am terminat";

  finish(){G.players.forEach(p=>{p.score=Math.round((p.pcts||[0]).reduce((a,b)=>a+b,0)/Math.max(1,(p.pcts||[]).length))});

    endMatch(w?`${w.name} câștigă circuitul`:"Egalitate","Scorul = media procentelor pe stații. O stație e promovată de la 75%.",w)}
};

    endMatch(w?`${w.name} câștigă pariul`:"Egalitate",`Calibrarea: cât de des aveați dreptate când erați „siguri”.<br>${cal||""}`,w)}

  async ask(){if(G.busy||G.over)return;G.busy=true;

    const r=await askQuestion(q,P,E,{time:q.type==="open"?Setup.tAns:0});closeSheet();
    if(!alive(g0))return;

    if(r.pass){const dmg=Math.max(1,Math.round(q.type==="mcq"?r.score*10:r.pct));P.score+=dmg;B.hp=Math.max(0,B.hp-dmg);G.roundHit=true;fx.dmg=dmg;
      this.log(`${P.name} lovește ${B.name}: −${dmg}`);if(B.hp<=0)cleared=true}

      Snd.phase();await phaseCard(`Faza ${B.phase+1} din 3`,B.phases[B.phase],"Boala avansează. Bara de viață se reface.",B.c);
      if(!alive(g0))return;B.max=B.hp=B.shown=G.hpTab[B.phase];this.render()}
    if(G.lives<=0){await sleep(reduced()?250:1200);if(alive(g0))this.finish(false);return}

  finish(won){const B=G.boss,tot=G.players.reduce((s,p)=>s+p.score,0);

const Bomb={
  start(){G.round=0;G.need=Math.ceil(Setup.bombRounds/2);G.players.forEach(p=>{p.score=0;p._shown=0});this.newRound()},
  newRound(){G.round++;const [a,b]=FUSE[Setup.fuse]||FUSE.mediu;G.fuseT=a+Math.random()*(b-a);G.fuseLeft=G.fuseT;G.holder=(G.round-1)%2;G.prevHolder=G.holder;
    this.screen(`Runda ${G.round}. Fitilul e nou și ascuns. ${G.players[G.holder].name} începe.`,true)},
  screen(msg,first){
    const H=G.players[G.holder];

    const sc=h(`<div class="screen narrow">
      <div class="panel arena">${pl(0)}<div class="bombwrap" data-side="${G.prevHolder}">${BOMB_SVG}</div>${pl(1)}</div>
      <div class="bturn"><div class="turn" style="--c:${H.color}"><div class="big">Bomba e la ${esc(H.name)}</div><div class="hint">${esc(msg)}</div>
        <div class="rd">Runda ${G.round} · meci din ${Setup.bombRounds} · câștigă cine ajunge primul la ${G.need}</div></div>
        <button class="btn pri lg ${G.holder?"p2c":""}" id="go">${esc(H.name)} preia bomba</button></div>
      <div class="rules" style="margin:4px 0 0;max-width:none"><div>Fitilul arde doar cât citești și răspunzi. Când adversarul bifează ideile, fitilul e oprit.</div>
      <div>Corect: bomba trece la celălalt. Greșit: mai primești o întrebare și bomba rămâne la tine. Când explodează, cine o ține pierde runda.</div></div></div>`);
    mount(sc,!!first);
    if(G.prevHolder!==G.holder){requestAnimationFrame(()=>requestAnimationFrame(()=>{$(".bombwrap",sc).dataset.side=G.holder}));if(!reduced())Snd.whoosh()}
    G.prevHolder=G.holder;
    turnBanner(H,`Bomba e la ${H.name}`);
    $("#go",sc).onclick=()=>this.ask()},
  async ask(){if(G.busy||G.over)return;G.busy=true;
    const g0=G,P=G.players[G.holder],E=other(P),q=G.dealer.next(G.lastQ);G.lastQ=q;Snd.click();
    const ctl={};let burning=false,last=performance.now(),nextTick=0,exploded=false;
    const danger=h(`<div class="danger"></div>`);document.body.append(danger);
    const vis=()=>{const ten=Math.min(1,Math.max(0,1-G.fuseLeft/G.fuseT)),beat=Math.max(.2,1.1-ten*.92);
      document.documentElement.style.setProperty("--beat",beat.toFixed(2)+"s");
      document.documentElement.style.setProperty("--heat",`hsl(${Math.round(38-34*ten)} 100% ${Math.round(64-6*ten)}%)`);
      danger.style.opacity=(Math.pow(ten,2.2)*.85).toFixed(3);return {ten,beat}};
    vis();
    G.bombIv=setInterval(()=>{const now=performance.now(),dt=(now-last)/1000;last=now;if(!burning)return;
      G.fuseLeft-=dt;const {ten,beat}=vis();

      if(G.fuseLeft<=0){exploded=true;clearInterval(G.bombIv);G.bombIv=0;ctl.abort()}},50);
    const r=await askQuestion(q,P,E,{time:0,ctl,head:`<span class="pill bombpill"><i></i>Bomba</span>`,
      onPhase:p=>{burning=p==="answer";last=performance.now();if(!burning)danger.style.opacity=(+danger.style.opacity*.4).toFixed(3)}});
    clearInterval(g0.bombIv);g0.bombIv=0;danger.remove();
    if(!alive(g0))return;G.busy=false;
    if(exploded){$$(".lightbox").forEach(l=>l.remove());closeSheet();return this.explode()}
    closeSheet();P.n++;if(r.pass)P.ok++;
    if(r.pass){G.holder=1-G.holder;this.screen(`${P.name} a răspuns corect. Bomba trece la ${E.name}.`)}
    else this.screen(`${P.name} a greșit și păstrează bomba. Încă o întrebare.`)},
  explode(){const L=G.players[G.holder],W=other(L);W.score++;

    const done=W.score>=G.need;
    const sc=h(`<div class="screen narrow"><div class="panel boomcard"><div class="eyebrow" style="color:var(--bad)">Runda ${G.round}</div>
      <h1>Bomba a explodat la <span style="color:${L.color}">${esc(L.name)}</span></h1>
      <p>Runda o câștigă <b style="color:${W.color}">${esc(W.name)}</b>. Scor: ${G.players.map(p=>`${esc(p.name)} ${p.score}`).join(" – ")}.</p>
      <div class="actions" style="justify-content:center;margin-top:22px"><button class="btn pri lg" id="go">${done?"Vezi rezultatul":"Runda următoare"}</button></div></div></div>`);
    mount(sc,true);
    if(!reduced()){const r=$(".boomcard",sc).getBoundingClientRect();FX.burst(r.left+r.width/2,r.top+40,["#FF6B6B","#FFBE5C","#ffd166"],60,{sp:7,life:60,r:2.6})}
    $("#go",sc).onclick=()=>{Snd.click();done?this.finish():this.newRound()}},
  finish(){const [a,b]=G.players;const w=a.score===b.score?null:a.score>b.score?a:b;
    endMatch(w?`${w.name} câștigă Bomba`:"Egalitate",`Cele mai multe runde din ${Setup.bombRounds}. Pierde runda cine ține bomba când explodează.`,w)}
};

const Sim={
  start(){
    const S=simState(),by={};
    for(const q of shuffle(G.qs.filter(q=>q.type==="mcq")))(by[q._subject]??=[]).push(q);
    /* ~35% complement simplu pe materie; dacă un tip nu ajunge, completează cu celălalt */
    const take=(s,n)=>{const arr=by[s]||[];n=Math.min(n,arr.length);let pick;
      if(S.realCS){const cs=arr.filter(isCS),cm=arr.filter(q=>!isCS(q));let a=cs.slice(0,Math.round(n*.35));const b=cm.slice(0,n-a.length);
        if(a.length+b.length<n)a=cs.slice(0,n-b.length);pick=a.concat(b)}
      else pick=arr.slice(0,n);
      const used=new Set(pick);by[s]=arr.filter(q=>!used.has(q));return shuffle(pick)};

    S.blocks.forEach(b=>{const its=[];b.rows.forEach(r=>take(r.s,Math.max(0,Math.floor(+r.n||0))).forEach(q=>its.push({q,s:r.s})));

    if(!items.length){G=null;renderSetup(true);toast("Nu există grile pentru blocurile alese");return}
    G.exam={items,blocks,cur:0,limit:simSeconds(items.length),t0:Date.now()};

    const r=$("#xQ").getBoundingClientRect();if(r.top<0||r.top>innerHeight*.6)window.scrollTo({top:Math.max(0,scrollY+r.top-(innerWidth>900?150:170))})},
  tick(){const X=G.exam,el=$("#xT");if(!el||G.over)return;const t=(Date.now()-X.t0)/1000;
    if(X.limit){const left=X.limit-t;el.textContent=fmt(left);el.classList.toggle("low",left<=60);
      if(left<=10&&left>0)Snd.tick();if(left<=0){Snd.alarm();this.finish(true)}}
    else{el.textContent=fmt(Math.floor(t));el.classList.add("up")}},
  askSubmit(){const X=G.exam,N=X.items.length,empty=X.items.filter(i=>!i.sel.length).length,fl=X.items.filter(i=>i.flag).length,one=X.items.filter(i=>!isCS(i.q)&&i.sel.length===1).length;
    this.drawer(false);Snd.click();const c=openSheet();c.classList.add("small");
    c.innerHTML=`<h2 class="st">Predai lucrarea?</h2><p style="color:var(--dim);margin:8px 0 0">Ai răspuns la ${N-empty} din ${nGr(N)}. După predare nu mai poți schimba răspunsurile.</p>
      <div class="subm"><div class="${empty?"w":""}"><b>${empty}</b><span>necompletate</span></div><div class="${fl?"f":""}"><b>${fl}</b><span>marcate</span></div>${one?`<div class="w"><b>${one}</b><span>CM cu o singură bifă</span></div>`:""}</div>
      <div class="actions">${empty||fl?`<button class="btn sec2" id="mGo">${empty?"Prima necompletată":"Prima marcată"}</button>`:""}<button class="btn sec2" id="mNo">Mă mai uit</button><button class="btn pri" id="mYes">Predă lucrarea</button></div>`;
    $("#mNo",c).onclick=()=>closeSheet();
    $("#mYes",c).onclick=()=>this.finish(false);
    const g=$("#mGo",c);if(g)g.onclick=()=>{closeSheet();this.go(X.items.findIndex(i=>empty?!i.sel.length:i.flag))}},
  finish(auto){if(!G||G.over)return;const X=G.exam,P=G.players[0];G.over=true;clearInterval(G.simIv);G.simIv=0;closeSheet();
    X.auto=auto;X.tUsed=Math.min(X.limit||Infinity,(Date.now()-X.t0)/1000);
    X.items.forEach(it=>{it.score=gradeMCQ(it.q,it.sel)});
    /* nota = punctaj obținut / punctaj maxim × 10, cu 2 zecimale; promovat de la 5,00 */
    const note=its=>{const pts=its.reduce((s,i)=>s+i.score,0),max=its.length*10,n=max?Math.round(pts/max*1000)/100:0;return {pts,max,n,pass:n>=5}};
    X.res=X.blocks.map((b,bi)=>{const its=X.items.filter(i=>i.b===bi);
      return {...b,count:its.length,...note(its),subs:b.subs.map(s=>{const si=its.filter(i=>i.s===s);return {s,count:si.length,...note(si)}})}});
    X.items.forEach(it=>Mem.record(it.q,P.name,it.score>=10));
    P.n=X.items.length;P.ok=X.items.filter(i=>i.score>=10).length;const all=note(X.items);P.score=all.n;
    const passed=X.res.filter(r=>r.pass).length;
    Mem.addMatch({d:new Date().toISOString(),mode:"unix",p:[{n:P.name,s:nfmt(all.n,2),ok:P.ok,q:P.n}],units:G.units.map(id=>(IDX().find(u=>u.id===id)||{}).title||id),w:null,
      notes:X.res.map(r=>({n:r.name,v:r.n,sep:r.sep,pass:r.pass})),pass:passed,t:Math.round(X.tUsed)});
    if(auto)toast("Timpul a expirat: lucrarea a fost predată automat",3200);
    const won=passed===X.res.length;
    if(won)Snd.win();else{Snd.bell(587.33,.05,0,.9);Snd.bell(698.46,.04,.13,1)}
    this.results();
    if(won)setTimeout(()=>FX.celebrate(["#F09AC6","#5ee8a0","#ffd166"]),200)},
  results(){const X=G.exam,R=X.res,N=X.items.length,passed=R.filter(r=>r.pass).length;
    const col=passed===R.length?"var(--ok)":passed?"var(--warn)":"var(--bad)";
    const full=X.items.filter(i=>i.score>=10).length,empty=X.items.filter(i=>!i.sel.length).length;
    const sc=h(`<div class="screen narrow"><div class="panel rsum"><div class="eyebrow">Simulare UNIX · rezultate${X.auto?" · predată automat":""}</div>
        <h1 style="color:${col}">${passed} din ${R.length} ${R.length===1?"bloc promovat":"blocuri promovate"}</h1>
        <div class="rmeta"><div><b>${fmt(X.tUsed)}</b><span>timp folosit${X.limit?` din ${fmt(X.limit)}`:""}</span></div><div><b>${N}</b><span>${wGr(N)} în total</span></div>
          <div><b>${full}</b><span>cu 10 / 10</span></div><div><b>${empty}</b><span>necompletate</span></div></div></div>
      <div class="rcards">${R.map(r=>`<div class="panel rcard ${r.sep?"sep":""}">
        <div class="rch"><h3>${esc(r.name)}</h3><span class="sbtag ${r.sep?"":"blk"}">${r.sep?"materie separată":"bloc"}</span><span class="rpts" style="margin-left:auto">${nGr(r.count)}</span></div>
        <div class="rnote"><span class="nv" style="color:${r.pass?"var(--ok)":"var(--bad)"}" data-from="0" data-to="${r.n}" data-dec="2" data-ms="1100">0,00</span><span class="rbadge ${r.pass?"ok":"no"}">${r.pass?"Promovat":"Nepromovat"}</span></div>
        <div class="rpts">${r.pts} / ${r.max} puncte${r.sep&&r.subs[0]?` · ${esc(subjName(r.subs[0].s))}`:""}</div><div class="bar"><i style="width:${r.n*10}%;background:${r.pass?"var(--ok)":"var(--bad)"}"></i></div>
        ${r.sep?"":`<div class="rsub">${r.subs.map(s=>`<div class="rsr"><span class="schip" style="--c:${subjColor(s.s)}"><i></i>${esc(subjName(s.s))}</span>
          <span class="nn" style="color:${s.pass?"var(--bone)":"var(--bad)"}" data-from="0" data-to="${s.n}" data-dec="2" data-ms="1100">0,00</span>
          <span class="pp">${s.pts} / ${s.max} puncte · ${nGr(s.count)}</span></div>`).join("")}</div>`}</div>`).join("")}</div>
      <div class="actions" style="justify-content:center;margin-top:22px"><button class="btn sec2" id="rRev">Revizuiește grilele</button><button class="btn sec2" id="rMenu">Meniu</button><button class="btn pri" id="rAgain">Reia aceeași configurație</button></div></div>`);
    mount(sc,true);animateScores(sc);
    $("#rRev",sc).onclick=()=>{Snd.click();this.review(X.rvOnly)};
    $("#rMenu",sc).onclick=()=>{Snd.click();G=null;renderSetup(true)};
    $("#rAgain",sc).onclick=()=>startGame(poolMeta())},
  review(only){const X=G.exam;X.rvOnly=!!only;
    const bad=X.items.filter(i=>i.score<10).length;
    const list=X.items.map((it,i)=>({it,i})).filter(o=>!X.rvOnly||o.it.score<10);
    const item=({it,i})=>{const q=it.q,cs=isCS(q),B=X.blocks[it.b];
      return `<div class="panel rv"><div class="rvh"><span class="rvn">${i+1}</span><span class="pill bn">${esc(B.name)}</span><span class="schip" style="--c:${subjColor(it.s)}"><i></i>${esc(subjName(it.s))}</span><span class="pill">${esc(q._unitLabel)}</span>
        <span class="rvs ${it.score>=10?"ok":it.score>=6?"mid":"no"}">${it.score} / 10</span></div>
        <div class="qtext">${md(q.q)}</div>${q._img?`<div class="qimg"><img alt="Imaginea grilei" src="${esc(q._img)}"></div>`:""}${kindHTML(q)}
        <div class="opts">${q.opts.map((t,k)=>{const c=q.ok.includes(k),s=it.sel.includes(k);
          const lab=c&&s?(cs?"corect ales":"corect bifat"):c?(cs?"răspunsul corect":"corect nebifat"):s?(cs?"greșit ales":"greșit bifat"):"";
          return `<div class="opt ${c&&s?"r-ok":c?"r-miss":s?"r-bad":"r-fine"}"><span class="k">${"ABCDE"[k]}</span><span>${md(t)}</span>${lab?`<span class="res">${lab}</span>`:""}</div>`}).join("")}</div>
        ${!it.sel.length?`<div class="simwarn">Necompletată: 0 puncte.</div>`:!cs&&it.sel.length===1?`<div class="simwarn">O singură variantă bifată la complement multiplu: 0 puncte.</div>`:""}
        ${q.why?`<div class="why">${md(q.why)}</div>`:""}</div>`};
    const sc=h(`<div class="screen narrow">
      <div class="rvbar"><button class="btn sec2 sm" id="rvBack">← Rezultatele</button><h2>Revizuirea grilelor</h2>
        <button class="chip" id="rvF" aria-pressed="${X.rvOnly}">Doar greșite / incomplete <small>${bad}</small></button></div>
      <div class="rvleg"><span><i class="g"></i>corect bifat</span><span><i class="y"></i>corect nebifat</span><span><i class="r"></i>greșit bifat</span></div>
      ${list.map(item).join("")||`<div class="panel empty">Toate grilele au 10 / 10. Nu ai nimic greșit de revizuit.</div>`}
      <div class="actions" style="justify-content:center"><button class="btn sec2" id="rvBack2">Înapoi la rezultate</button></div></div>`);
    mount(sc,true);
    $$(".qimg",sc).forEach(d=>d.onclick=()=>lightbox($("img",d).src));
    $("#rvBack",sc).onclick=$("#rvBack2",sc).onclick=()=>{Snd.click();this.results()};
    $("#rvF",sc).onclick=()=>{Snd.click();this.review(!X.rvOnly)}}
};
/* taste în simulare (doar când focusul nu e într-un câmp de text și nu e deschis niciun dialog) */
document.addEventListener("keydown",e=>{
  if(!G||G.mode!=="unix"||G.over||!G.exam||SHEET||$(".lightbox"))return;
  const t=e.target;if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;let i=k.length===1?"abcde".indexOf(k.toLowerCase()):-1;if(i<0&&/^[1-5]$/.test(k))i=+k-1;
  if(i>=0){e.preventDefault();Sim.toggle(i);return}
  if(k==="ArrowLeft"){e.preventDefault();Sim.go(G.exam.cur-1)}
  else if(k==="ArrowRight"){e.preventDefault();Sim.go(G.exam.cur+1)}
  else if(k==="m"||k==="M"){e.preventDefault();Sim.flag()}});

/* ============================ statistici ============================ */
$("#bStats").onclick=()=>{Snd.click();const c=openSheet();
  const players=Object.keys(Mem.stats);
  const unitName=id=>{const u=IDX().find(x=>x.id===id);return u?`${(SUBJ[u.subject]||{name:u.subject}).name} · ${u.unit}`:id};
  let rows="";
  for(const p of players){for(const [k,v] of Object.entries(Mem.stats[p]).sort()){const pc=Math.round(v.ok/v.n*100);
    rows+=`<tr><td>${esc(p)}</td><td>${esc(unitName(k))}</td><td>${v.ok}/${v.n}</td><td><div class="bar"><i style="width:${pc}%;background:${pc>=75?"var(--ok)":pc>=50?"var(--warn)":"var(--bad)"}"></i></div></td></tr>`}}
  const hist=Mem.hist.slice(0,15).map(m=>m.mode==="unix"&&m.notes?`<tr><td>${new Date(m.d).toLocaleDateString("ro-RO")}</td><td>${MODE_NAME.unix}</td><td>${esc(m.p[0].n)}: ${m.notes.map(n=>`${esc(n.n)} <b style="color:${n.pass?"var(--ok)":"var(--bad)"}">${nfmt(n.v,2)}</b>`).join(" · ")}</td><td>${m.pass} / ${m.notes.length} promovate</td></tr>`
    :`<tr><td>${new Date(m.d).toLocaleDateString("ro-RO")}</td><td>${MODE_NAME[m.mode]||m.mode}</td><td>${m.p.map(p=>`${esc(p.n)} ${p.s}`).join(" – ")}</td><td>${esc(m.w||"egal")}</td></tr>`).join("");
  c.innerHTML=`<div class="qhead"><h2 class="st">Statistici</h2><button class="btn sec2 sm" style="margin-left:auto" id="x">Închide</button></div>
    <div class="lbl2">Pe materie și LP</div>${rows?`<div style="overflow:auto"><table class="table"><tr><th>Jucător</th><th>Unitate</th><th>Corecte</th><th>Procent</th></tr>${rows}</table></div>`:`<div class="empty">Încă nu ați jucat. Statisticile apar după primul meci.</div>`}
    <div class="lbl2" style="margin-top:22px">Ultimele meciuri</div>${hist?`<div style="overflow:auto"><table class="table"><tr><th>Data</th><th>Mod</th><th>Scor / note</th><th>Rezultat</th></tr>${hist}</table></div>`:`<div class="empty">Niciun meci încheiat.</div>`}
    <p style="color:var(--dim);font-size:13.5px;margin-top:18px">Lista de greșeli are ${Object.keys(Mem.mistakes).length} întrebări. O întrebare iese din listă după 2 răspunsuri corecte la rând.</p>
    <div class="actions"><button class="btn bad sm" id="rs">Șterge statisticile și greșelile</button></div>`;
  $("#x",c).onclick=closeSheet;
  $("#rs",c).onclick=()=>{if(confirm("Ștergi toate statisticile, istoricul și lista de greșeli?")){Mem.stats={};Mem.mistakes={};Mem.hist=[];store.set("stats",{});store.set("mistakes",{});store.set("hist",[]);closeSheet();toast("Statisticile au fost șterse")}}};

/* tasta Escape închide doar mărirea imaginii și panoul de sunet; nimic nu interceptează Space în câmpurile de text */
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const l=$(".lightbox");if(l)l.remove();closeSnd()}});

syncSoundBtns();
renderSetup(true);
</script>
